# Open, unresolved risks this draft surfaces but does not decide (bench-
# reviewer gate items) — see the named README section for full context/math.
known_risks:
  - id: f6-protocol-estimate-superseded
    readme_ref: "README.md §4"
    status: resolved-in-this-draft
    summary: >
      Plan F6's "16,157 qwen3.6-class protocol" figure does not reconcile
      with the 2026-08-25 protocol-alone probe (14,276) and is superseded by
      it in this lane's budgets; F6 itself needs a superseded-by-probe note
      in the plan doc (not edited here — out of this task's scope).
  - id: gate-f2-curated-digest-cap
    readme_ref: "README.md §4"
    status: SUPERSEDED-BY-MEASUREMENT 2026-08-26   # the cap's premise (~7% overestimate
        # -> ~1,942 real margin) was falsified by F14 (prose overestimate is 22-30%);
        # all 12 CURATED@32K probes (6 fixtures x 2 models, receipts/dump-measured-
        # probes-2026-08-26.json) fit with 4,561-8,608 MEASURED margin tokens — worst
        # is modal-complete-clean @ 35b (full prompt 20,015 + 8,192 = 28,207 <= 32,768).
        # Three frozen digests exceed the old 3,000-measured-derived cap on the est
        # side (modal 3,877 / tabs 3,501 / file-input 4,510 est) and every one fits
        # with thousands of measured tokens to spare; no INVALID-row risk in evidence.
    summary: >
      Gate F2 original text (kept for the record): at 32,768 the client-side
      guard's ~7% overestimate leaves CURATED only ~1,942 real margin tokens —
      a >3,000-token digest risks an INVALID row. Hard cap: CURATED digest
      <=3,000 measured tokens, probe-verified on the largest of the 6
      fixtures before freeze. Superseded as annotated above — the pre-freeze
      probe requirement WAS honored (all 12 cells probed before any scored
      row); the numeric cap itself rested on the falsified ~7% figure.
  - id: num-ctx-standardized-40960
    readme_ref: "README.md §4/§4.1"
    status: resolved-in-this-draft
    summary: >
      DUMP-cell ruling (gate review) + orchestrator decision, now EMPIRICALLY
      CONFIRMED (2026-08-25 ceiling probe: qwen3:32b clamps a requested 49152
      to its declared 40960 — server log "requested context size too large
      ... n_ctx_train=40960"; qwen3.6:35b declares 262144, no clamp). The
      lane standardizes on num_ctx=40960 for the 40K cells, matching the
      repo's ACR-lane high-water mark and making P1b a matched 32K->40K
      contrast for both models. See conditions: below.
  - id: truncation-formula-2-of-2-replications
    readme_ref: "README.md §4.1"
    status: empirical-formula-mechanism-unconfirmed
    summary: >
      floor(n_ctx/2)+2 as the silently-evaluated token count under an
      overflow/clamp has now matched twice at different scales: Phase 0.4b
      historical (n_ctx=16384 -> 8194 tokens, 49.8% of that prompt) and the
      2026-08-25 ceiling probe (n_ctx=40960 post-clamp -> 20482 tokens, 54.7%
      dropped from a 45176-token prompt). Both re-derived and confirmed
      arithmetically. Treated as a PREDICTIVE planning formula for budget
      math in this lane; the underlying Ollama mechanism producing it is NOT
      independently confirmed — 2 data points, not a proof.
  - id: f13-phase0-guard-blind-to-declared-context-length
    readme_ref: "README.md §4.1"
    status: confirmed-major-routed-elsewhere
    summary: >
      Gate-confirmed MAJOR finding (credited to phase3-lane-designer, escapes
      this lane's scope): run_benchmark.py's Phase 0.2 client-side overflow
      guard estimates against the REQUESTED num_ctx only, never a model's
      declared /api/tags context_length — so a request above a model's real
      ceiling (exactly this lane's original 49152-vs-qwen3:32b situation)
      would have been waved through as fitting while the server silently
      truncated underneath it. Routed to the runner-builder as a Phase 0
      fast-follow (NOT ollama/run_benchmark.py — do not fix here or in this
      lane's own files).
  - id: overflow-receipt-fixture-pinned
    readme_ref: "README.md §4.1/§8"
    status: resolved-in-this-draft
    summary: >
      The plan's "1 fixture x 1 draw per model" OVERFLOW receipt needs a
      named fixture for determinism (an operator-choice default risks a
      non-reproducible receipt). Pinned to tabs-missing-arrow-nav — see
      overflow_receipt_fixture: below — matching the exact arithmetic
      already computed against it (14276 + 891 + 15000 + 8192 = 38359 >
      32768, guard fires).
  - id: f14-dump-json-tokenization-ratio-unmeasured
    readme_ref: "README.md §4.1a"
    status: RESOLVED-BY-MEASUREMENT 2026-08-26   # 12 probes (6 dumps x 2 models, receipts/dump-measured-probes-2026-08-26.json):
        # real dump content (mostly JSON) est/measured = 1.07-1.11 on qwen3:32b and
        # 1.01-1.03 on qwen3.6:35b — the estimator mildly OVERcounts JSON (never the
        # prose 1.22-1.30, never the feared <=0.918 undercount requirement, which is
        # moot because the packs were built to the ESTIMATED ceiling, not to 15000
        # measured). Every assembled DUMP prompt fits: worst measured 31,721
        # (modal-complete-clean @ 35b) + 8,192 = 39,913 <= 40,960 (margin 1,047).
        # Measured dump content lands ~14.3-15.6K tokens on 35b — at ruling 7's
        # 15,000-measured informational target by construction, not by luck.
    summary: >
      Gate F14. The client-side guard gates on estimated tokens
      (chars/3.5); this lane's binding dump spec (15000 measured tokens) is
      stated in measured tokens. For a 15000-measured dump to clear the
      13764-estimated-token guard ceiling worked out for the one measured
      fixture, its est/measured ratio must be <=0.918 -- the estimator would
      need to UNDERcount the dump, the opposite direction from every ratio
      measured so far (1.22-1.30, all prose). Whether real dump content
      (mostly JSON: axe rule output, keyboard traces) tokenizes densely
      enough to land in that range is unmeasured -- plausible (dense
      punctuation could push it to 2.5-3.5 chars/token) but not proven.
      Scaling by the only ratio in hand (prose) would refuse every DUMP row
      as INVALID -- the entire dilution arm of P1. MUST be measured before
      freeze (README §10 step 4) -- §10's no-regeneration rule makes this
      uncorrectable after the fact, which is why it is a pre-freeze gate,
      not a post-hoc check.

