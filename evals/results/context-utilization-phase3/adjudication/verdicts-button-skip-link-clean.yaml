# ADJUDICATION RULE APPLIED (recorded so the call is auditable):
#   REAL-FP            = the row files a defect (Critical/Major/Minor tier) asserting a WCAG
#                        failure or broken behavior that ground truth does not recognize.
#   SCOPED-ENHANCEMENT = framed as enhancement / polish / optional hardening / consumer-contract,
#                        OR is the ground-truth nice_to_find (aria-current), OR explicitly
#                        declines to assert a failure ("2.4.1 is met", "not an AA failure").
#   NOT-A-FINDING      = observation, restated evidence, hedged "needs verification" commentary,
#                        Open Question, or a positive/clean statement.
#   Duplicate filings of the SAME nonexistent defect count once (real_fp_count = distinct
#   fabricated defects asserted, not distinct filed entries).
#
# ADJUDICATOR DISSENT — READ BEFORE USING THESE NUMBERS (fixture-quality problem, not model noise):
#   The fixture CSS genuinely contains `.main-nav a:focus { outline: 3px solid #0066cc;
#   outline-offset: -3px }` over `.main-nav { background: #333 }`. #0066cc vs #333333 computes to
#   2.271:1 (L=0.13873 / 0.03310), against the 3:1 non-text threshold, with #333 adjacent on BOTH
#   sides because the offset is negative. That arithmetic is correct and independently reproduced
#   by 8 of 20 rows. Understanding SC 1.4.11 treats author-styled focus indicators as state
#   information at 3:1, so the AA mapping is the dominant professional reading (contested, not
#   fringe). Ground truth declares the fixture CLEAN and lists "Focus indicators visible on
#   navigation links" as an implemented feature, saying nothing about ratio.
#   I have scored these as REAL-FP because the task designates ground truth authoritative — but
#   they are NOT fabrications, and reporting them as evidence that opus/sonnet invent defects on
#   clean code would be wrong. Recommend either (a) fixing the fixture CSS to a >=3:1 ring, or
#   (b) adding the ring to expected_findings, before this fixture is used as an FP control again.
#   Same caveat, weaker, for the missing-tabindex-on-<main> class: real property of the fixture,
#   standard hardening advice; scored REAL-FP only where a row asserts the skip link is BROKEN or
#   fails 2.4.1, not where it says modern browsers handle it and tabindex is hardening.
#   The `page-has-heading-one` axe hit is real measured evidence tagged best-practice with NO WCAG
#   mapping; scored REAL-FP only where a row converts it into a WCAG SC violation (1.3.1 / 2.4.6 /
#   2.4.10 / 2.4.1 / 508 207.1) — those citations are wrong on the merits, not merely over-scoped.
