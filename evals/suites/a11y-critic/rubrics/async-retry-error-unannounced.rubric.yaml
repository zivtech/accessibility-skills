fixture_id: async-retry-error-unannounced
rubric_version: "1.0"
dimensions:
  - id: must_find
    name: "Must-Find Issues"
    description: "Critical issues a competent reviewer should find"
    weight: 3

  - id: should_find
    name: "Should-Find Issues"
    description: "Major issues a skilled reviewer would find"
    weight: 2

  - id: nice_to_find
    name: "Nice-to-Find Issues"
    description: "Subtle gaps or optimizations"
    weight: 1

  - id: evidence_quality
    name: "Evidence Quality"
    description: "CRITICAL/MAJOR findings backed by file:line or quotes"
    weight: 1

  - id: format_compliance
    name: "Format Compliance"
    description: "Output matches a11y-critic format contract"
    weight: 1

expected_findings:
  - category: must_find
    count: 2
    items:
      - description: "error-branch alert-container absent-entirely, failure-silent — the failed request mounts a bare paragraph with nothing assertive around it"
        severity: CRITICAL
        wcag: "4.1.3 Status Messages"
        evidence_requirement: "file:line reference to the error branch (lines 41-45) lacking role='alert'/aria-live; credit is stronger when the review contrasts it with the correct loading region at lines 34-39"
        expected_to_find: "75%"

      - description: "recovery-transition unspoken, results-mount-silent retry-outcome-lost — a successful retry swaps the error text for a plain list"
        severity: MAJOR
        wcag: "4.1.3 Status Messages"
        evidence_requirement: "file:line reference to the results list (lines 47-57) mounting with no announcement, and/or the observation that the only live region (lines 34-39) has unmounted by that point"
        expected_to_find: "45%"

  - category: should_find
    count: 0

  - category: nice_to_find
    count: 2
    items:
      - description: "Optional: the error text does not name a retry affordance by its label, so a user who hears the message has to hunt for the 'Retry' button"
        impact: "Enhancement suggestion (ENHANCEMENT severity)"
        expected_to_find: "25%"
      - description: "Optional: status is initialised to 'loading' (line 7), so the live region enters the DOM with its message already inside it on first mount and is frequently not spoken — the loading announcement the component appears to make does not reliably fire either"
        impact: "Enhancement suggestion. This is a correct observation about the same mount-timing principle the CLEAN pair member is built on, and it is scored so that a reviewer who reaches it is credited rather than caught by the narrowed trap above."
        expected_to_find: "35%"

composite_score_formula: |
  score = sum(found_items * weight) / sum(all_positive_weights) * 100

scoring_thresholds:
  excellent: 90-100
  good: 75-89
  adequate: 60-74
  weak: 40-59
  poor: 0-39

expected_reviewer_performance:
  - condition: harsh-critic
    expected_score: 80-100
    reasoning: "Should trace the state machine, find the unannounced failure, and reach the recovery defect. The recovery item is the discriminator — it requires reasoning about which live region is still mounted at the moment the results render."
  - condition: baseline-zero-shot
    expected_score: 35-60
    reasoning: "Likely finds the missing role='alert' on the error branch. Likely misses the recovery defect, and is the condition most at risk of the loading-region false alarm."
  - condition: baseline-few-shot
    expected_score: 45-70
    reasoning: "A dynamic-content example raises the chance of checking every branch for a live region, but the recovery defect is about live-region lifetime rather than presence, which few-shot prompting does not usually surface."

verdict_expectations:
  harsh-critic: REVISE
  baseline-zero-shot: REVISE
  baseline-few-shot: REVISE

notes: |
  Provenance: GT-07 (ledger PT-16). Independent public reference: WCAG 4.1.3
  Status Messages and its techniques (ARIA19, ARIA22, ARIA23, G199) — this
  fixture is the second reproduction under promotion-bar clause 1, and no
  skill text ships on this pattern until it exists.

  Scope of what this fixture does NOT test, stated so the pair is not read as
  covering more than it does: it does not test aria-busy (covered by
  loading-state-missing-aria-busy), success-message wording (async-form-vague-success),
  client-side validation error clearing (multistep-form-error-clearing), or
  empty result sets (present but uncredited in search-results-dynamic-clean).
  It tests exactly two things: whether a failed async request is announced, and
  whether the transition back out of the failure state is announced.

  The recovery item carries a deliberately low expected_to_find (45%). It is the
  half of the pattern that engagement evidence showed being missed most often,
  and a fixture whose second item everyone finds would not discriminate.

  The three false-positive traps exist because the happy path here is correct.
  Without them, a reviewer could score well by reporting "this async component
  needs live regions" without ever reading which branch has one.

# Non-scored. No scorer reads this key, and none is intended to.
# Fixture-authoring documentation only: which correct patterns in this fixture
# look wrong to a reviewer. Relocated here from the deleted `false_positive_trap`
# scoring dimension (issue #63). Any rate below is the original author's
# prediction, never a measurement: the #65 probe measured the predicted trap
# constructs firing at 0-10% while the real CLEAN false-positive rate sat at 93%,
# which is why the dimension was deleted rather than scored.
non_scored_authoring_notes:
  false_positive_traps:
    - description: "The loading branch has a correctly-formed live region — reporting it as MISSING is a false alarm"
      impact: "Lines 34-39 carry role='status', aria-live='polite' and aria-atomic='true'. A review that reports 'this component has no live region' or 'the loading state needs one added' has pattern-matched the component type instead of reading the branch, and has also missed both real defects, which live on the other two branches. NARROWED 2026-09-03: this trap does NOT cover the separate, correct observation that the region is mounted already-populated on first render (status is initialised to 'loading' at line 7) and therefore may not be spoken at all — that is scored as a nice_to_find below, not penalised here. Three independent draws reached it, and the earlier wording would have scored every one of them -2 for being right."
      expected_to_find: "80%"

    - description: "aria-busy on the panel body is present and correct — flagging it as missing is a false alarm"
      impact: "Line 33 sets aria-busy={status === 'loading'} on .panel-body. This fixture deliberately does not repeat the aria-busy defect that loading-state-missing-aria-busy already covers."
      expected_to_find: "75%"

    - description: "aria-hidden='true' on the decorative spinner is correct — flagging it is a false alarm"
      impact: "Line 36's spinner is a CSS animation with no text; the adjacent 'Loading activity…' string inside the same live region carries the message. Flagging 'spinner hidden from screen readers' misreads a correct decorative-image decision."
      expected_to_find: "70%"
