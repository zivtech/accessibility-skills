fixture_id: garden-plot-directory
rubric_version: "1.0"
dimensions:
  - id: must_find
    name: "Must-Find Issues"
    description: "The duplicate-landmark defect must be found"
    weight: 2
    note: "Detection alone is only half the score for this fixture — see severity_calibration below, which carries the higher weight"

  - id: severity_calibration
    name: "Severity Calibration (central dimension for this fixture)"
    description: >
      The duplicate-landmark finding must be rated MINOR or ENHANCEMENT
      (advisory), matching its actual impact: every link in both nav copies
      remains correctly labeled and fully operable, and no content or task
      is unreachable — only landmark-navigation efficiency is degraded.
    weight: 4
    scoring_rule: |
      0  — finding missed entirely (a real, if minor, defect goes unreported)
      0  — finding present but rated CRITICAL or MAJOR/SERIOUS (severity
           inflation is scored as a calibration FAILURE, not extra credit
           for vigilance)
      full credit — finding present AND rated MINOR/ENHANCEMENT, or rated
           with an explicitly-reasoned low severity that correctly weighs
           "workaround exists, nothing is blocked" against "duplicate ARIA
           landmark, sounds bad in the abstract"
    note: "This is the fixture's primary purpose. A reviewer who is thorough enough to find the defect but miscalibrates its severity should NOT outscore one who finds it and rates it correctly — write scoring so severity inflation cannot net a higher composite than correct calibration."

  - id: should_find
    name: "Should-Find Issues"
    description: "Redundant tab stops from the same duplication"
    weight: 2

  - id: evidence_quality
    name: "Evidence Quality"
    description: "Findings backed by file:line or quotes, and the severity rating backed by explicit impact reasoning"
    weight: 1

  - id: format_compliance
    name: "Format Compliance"
    description: "Output matches a11y-critic format contract"
    weight: 1

expected_findings:
  - category: must_find
    count: 1
    items:
      - description: "Two identically-labeled nav landmarks present simultaneously once scrolled"
        wcag: "1.3.1 Info and Relationships, 4.1.2 Name, Role, Value"
        expected_to_find: "55%"
        expected_severity: MINOR
        calibration_note: "Track two outcomes separately when scoring: (a) was the defect found, (b) was it rated MINOR/advisory. A CRITICAL or MAJOR rating on a found defect is a distinct failure mode from missing it, and both should be visible in the score breakdown."

  - category: should_find
    count: 1
    items:
      - description: "Redundant tab stops from the same DOM duplication"
        wcag: "2.4.3 Focus Order"
        expected_to_find: "30%"

composite_score_formula: |
  score = sum(found_items * weight) / sum(all_positive_weights) * 100
  severity_calibration scores 0 (not partial credit) if the must-find item
  is rated CRITICAL or MAJOR/SERIOUS, regardless of how well-evidenced the
  finding otherwise is

scoring_thresholds:
  excellent: 90-100
  good: 75-89
  adequate: 60-74
  weak: 40-59
  poor: 0-39

expected_reviewer_performance:
  - condition: harsh-critic
    expected_score: 80-100
    reasoning: "Should find the duplicate landmark easily (it requires no subtle tracing, only checking DOM state at a scrolled position), correctly rate it MINOR given the intact workaround and unaffected operability, and not conflate the separately-named plot-map-filters nav with the defect"

  - condition: baseline-zero-shot
    expected_score: 30-60
    reasoning: "May find the duplicate (it is not hidden) but is more likely than a calibrated reviewer to over-rate it as CRITICAL/MAJOR on the reasoning that 'duplicate ARIA landmarks' sounds like a serious accessibility violation in the abstract, without weighing that every link remains reachable and correctly labeled"

  - condition: baseline-few-shot
    expected_score: 40-65
    reasoning: "A structured severity rubric in the prompt may reduce inflation somewhat, but generic few-shot examples are unlikely to specifically model 'real defect, low actual impact, therefore low severity' reasoning"

verdict_expectations:
  harsh-critic: REVISE
  baseline-zero-shot: REVISE
  baseline-few-shot: REVISE

notes: |
  HAS-BUGS fixture, severity-calibration shape — explicitly not a
  detection-difficulty test. The duplicate landmark (template nav +
  independently-built JS sticky-header clone, each correct in isolation)
  is easy to find; the fixture's entire purpose is measuring whether the
  reviewer's assigned severity matches actual impact.

  Scoring discipline: a reviewer who finds this defect and calls it
  CRITICAL or MAJOR has NOT done a better job than one who finds it and
  calls it MINOR — they have made a calibration error that should reduce
  their score on the severity_calibration dimension specifically, separate
  from and in addition to whatever credit they earn for detection itself.
  Do not let fluent, confident overstatement of this finding's severity
  read as thoroughness. This mirrors the a11y-critic skill's own Phase 8
  Realist Check: is the severity rating proportional to actual user impact,
  or inflated by review momentum?

  The false-positive trap: "Plot map filters" is a second, correctly and
  distinctly named nav landmark serving a genuinely different purpose.
  Treating its mere existence as further evidence of "a landmark problem"
  on this page is an over-generalization failure, scored the same as any
  other false positive.

# Non-scored. No scorer reads this key, and none is intended to.
# Fixture-authoring documentation only: which correct patterns in this fixture
# look wrong to a reviewer. Relocated here from the deleted `false_positive_trap`
# scoring dimension (issue #63). Any rate below is the original author's
# prediction, never a measurement: the #65 probe measured the predicted trap
# constructs firing at 0-10% while the real CLEAN false-positive rate sat at 93%,
# which is why the dimension was deleted rather than scored.
non_scored_authoring_notes:
  false_positive_traps:
    - description: "'Plot map filters' nav is a legitimate, separate landmark, not another instance of the bug"
      expected_to_find: "60%"
