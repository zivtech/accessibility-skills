fixture_id: composite-descendant-clean
rubric_version: "1.0"
dimensions:
  - id: must_find
    name: "Must-Find Issues"
    description: "Critical issues a competent reviewer should find"
    weight: 3
  - id: should_find
    name: "Should-Find Issues"
    description: "Major issues a skilled reviewer would find"
    weight: 2
  - id: nice_to_find
    name: "Nice-to-Find Issues"
    description: "Subtle gaps or optimizations"
    weight: 1
  - id: evidence_quality
    name: "Evidence Quality"
    description: "Any finding backed by file:line or quotes"
    weight: 1
  - id: format_compliance
    name: "Format Compliance"
    description: "Output matches a11y-critic format contract"
    weight: 1

expected_findings:
  - category: must_find
    count: 0
    impact: "No critical a11y issues present in the clean composite implementation"
  - category: should_find
    count: 0
    impact: "No major issues"
  - category: nice_to_find
    count: 1
    description: "Optional: aria-pressed usage on momentary command buttons"
    impact: "Enhancement suggestion (ENHANCEMENT severity)"
    expected_to_find: "50%"
composite_score_formula: |
  score = sum(found_items * weight) / sum(all_positive_weights) * 100
  where positive_weights = [must_find, should_find, nice_to_find, evidence_quality, format_compliance]

scoring_thresholds:
  excellent: 90-100
  good: 75-89
  adequate: 60-74
  weak: 40-59
  poor: 0-39

verdict_expectations:
  harsh-critic: ACCEPT
  baseline-zero-shot: ACCEPT
  baseline-few-shot: ACCEPT

notes: |
  CLEAN fixture for the composite-widget focus-owner / descendant contract
  (L-017 → R-26). It tests false-positive resistance on exactly the case the
  clause protects: a non-tabbable descendant reached via a composite's
  documented internal keys is not "unreachable."

  A11y-critic should:
  1. Name the WAI-ARIA APG Toolbar pattern.
  2. Recognize roving tabindex as correct (one tabindex=0, rest tabindex=-1).
  3. Confirm arrow-key reachability of the non-tabbable buttons.
  4. Give a clean verdict (ACCEPT), at most an ENHANCEMENT on aria-pressed.

  A REVISE verdict, or any finding that the tabindex="-1" buttons are
  unreachable / a broken tab order / a keyboard trap, is the false positive
  this fixture exists to catch. Scoring is detector output, not verdict
  authority — same routing rule as every local-model lane.

# Non-scored. No scorer reads this key, and none is intended to.
# Fixture-authoring documentation only: which correct patterns in this fixture
# look wrong to a reviewer. Relocated here from the deleted `false_positive_trap`
# scoring dimension (issue #63). Any rate below is the original author's
# prediction, never a measurement: the #65 probe measured the predicted trap
# constructs firing at 0-10% while the real CLEAN false-positive rate sat at 93%,
# which is why the dimension was deleted rather than scored.
non_scored_authoring_notes:
  false_positive_traps:
    description: "Correctly identifying roving tabindex (tabindex='-1' descendants reached via arrow keys) as intentional and correct"
    impact: "The core L-017 trap — a Tab-only reachability sweep wrongly reports the non-tabbable buttons as unreachable"
    expected_to_find: "80%"
