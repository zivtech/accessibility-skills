fixture_id: tool-catalog-layout
rubric_version: "1.0"
scoring_method: hybrid
hybrid_weights:
  rule_based: 0.7
  llm_judge: 0.3

dimensions:
  - id: must_find
    name: "Must-Find Issues"
    description: "Critical issues a competent reviewer should find"
    weight: 3

  - id: should_find
    name: "Should-Find Issues"
    description: "Major issues a skilled reviewer would find"
    weight: 2

  - id: nice_to_find
    name: "Nice-to-Find Issues"
    description: "Subtle gaps or optimizations"
    weight: 1

  - id: false_positive_trap
    name: "False Positive Avoidance"
    description: "Correctly avoiding flagging non-issues"
    weight: -2
    note: "Penalizes flagging the thumbnail's fixed pixel dimensions instead of the non-reflowing container/sidebar/grid"

  - id: evidence_quality
    name: "Evidence Quality"
    description: "CRITICAL/MAJOR findings backed by file:line or quotes"
    weight: 1

  - id: format_compliance
    name: "Format Compliance"
    description: "Output matches a11y-critic format contract"
    weight: 1

expected_findings:
  - category: must_find
    count: 1
    items:
      - description: "min-width:1024px plus fixed-width sidebar/card-row produces 2D scroll at 320px"
        severity: MAJOR
        wcag: "1.4.10 Reflow"
        evidence_requirement: "Names the specific min-width/fixed-width declarations and explains the resulting two-dimensional scroll at a 320px viewport, distinguishing it from ordinary single-direction page scroll"
        expected_to_find: "50%"

  - category: should_find
    count: 1
    items:
      - description: "Fixed px font sizes throughout; no relative units"
        severity: MAJOR
        wcag: "1.4.4 Resize Text"
        expected_to_find: "30%"

  - category: false_positive_trap
    count: 1
    items:
      - description: "Thumbnail's fixed pixel dimensions are not themselves the reflow defect"
        expected_to_find: "40%"

composite_score_formula: |
  score = sum(found_items * weight) / sum(all_positive_weights) * 100
  false_positive_trap is subtracted if the thumbnail's fixed size is flagged
  as the reflow defect instead of the container/sidebar/grid widths

scoring_thresholds:
  excellent: 90-100
  good: 75-89
  adequate: 60-74
  weak: 40-59
  poor: 0-39

expected_reviewer_performance:
  - condition: harsh-critic
    expected_score: 80-95
    reasoning: "Should identify the container's min-width as sufficient on its own to fail reflow, name the compounding fixed-width sidebar/card-row, and correctly locate the failure at the layout level rather than the thumbnail"

  - condition: baseline-zero-shot
    expected_score: 20-40
    reasoning: "Reflow/zoom testing at a specific viewport width is a less commonly-applied check in generic review; a reviewer scanning JSX/CSS for ARIA attributes may not compute what happens at 320px"

  - condition: baseline-few-shot
    expected_score: 30-50
    reasoning: "A structured prompt may include a general responsive-design check, which could catch the missing media queries without necessarily tracing why min-width alone is sufficient to fail"

verdict_expectations:
  harsh-critic: REVISE
  baseline-zero-shot: ACCEPT
  baseline-few-shot: ACCEPT-WITH-RESERVATIONS

notes: |
  HAS-BUGS fixture isolating WCAG 1.4.10 (Reflow): a fixed-width two-column
  layout with no media queries produces two-dimensional scrolling at a
  320px viewport. The container's own min-width is sufficient by itself to
  fail the criterion; the fixed sidebar width and non-wrapping card row are
  independent, compounding causes.

  Key discriminator: reviewers who scan for ARIA attributes and semantic
  HTML will find this component clean (it is, on those axes) — the defect
  only surfaces by reasoning about (or actually testing) layout behavior at
  a narrow viewport, a check zero-shot review commonly skips.

  The false-positive trap separates "has a fixed pixel size" (true of the
  thumbnail, and a fine practice) from "prevents reflow" (true of the
  container/sidebar/card-row widths, and the actual defect) — rewarding
  reviewers who locate the failure precisely rather than flagging every
  fixed-pixel value in the stylesheet.
