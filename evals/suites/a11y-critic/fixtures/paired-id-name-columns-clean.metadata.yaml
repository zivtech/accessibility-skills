fixture_id: paired-id-name-columns-clean
name: Paired Case ID and Case Name Links to the Same Record (CLEAN)
description: Maintenance-cases table whose Case ID and Case Name columns each link to the same record's detail page with different accessible names — a same-destination, different-name shape that a naive SC 3.2.4 check flags but WCAG Understanding's "same functionality" scope does not.
language: jsx
framework: React
difficulty: CLEAN
domain: Content & Semantic Structure
work_type: component_review

expected_findings:
  - category: must_find
    count: 0
    notes: "No critical issues. The table is correctly marked up and the paired Case ID/Case Name links are two distinct, correctly-labelled functions that happen to share a destination, not an inconsistency."

  - category: should_find
    count: 0

  - category: nice_to_find
    count: 1
    description: "Optional: the Case Name link's accessible name does not indicate it resolves to the same record as the Case ID link in the same row; a visually-hidden suffix on one of the two (e.g. 'Ridgeway Pumping Station, case 4471') would let a screen reader user confirm both links lead to the same case without leaving the row"
    severity: ENHANCEMENT

components_analyzed:
  - name: Table caption
    semantic_element: caption
    status: "Correct — real <caption> (line 16) names the table; not an aria-label substitute"

  - name: Column headers
    semantic_element: th
    aria_attributes:
      - scope: "col"
    status: "Correct — every column header (lines 19-22) carries scope='col'"

  - name: Case ID header cell / link
    semantic_element: th
    aria_attributes:
      - scope: "row"
    status: "Correct — the per-row identifier is the row header (line 28) with scope='row'; its link (line 29) has accessible name equal to the case number, disambiguated by the row/column header pairing in table-navigation mode"

  - name: Case Name link
    semantic_element: td > a
    status: "Correct — links to the same href as the Case ID link (line 32) but is a distinct affordance (scan-by-name vs. scan-by-id), so a different accessible name is expected, not an inconsistency"

  - name: Links, focus state
    status: "Correct — .cases-table a:focus-visible (lines 97-100) gives every link, including both links in a row, a visible outline on keyboard focus"

wcag_criteria:
  - "3.2.4 Consistent Identification (paired id/name links are different functionalities, not one function labelled two ways)"
  - "2.4.4 Link Purpose (In Context) (the Case ID link's short accessible name is disambiguated by its column header)"
  - "1.3.1 Info and Relationships (scope='col'/scope='row' identify header relationships)"

multi_perspective_coverage:
  - screen_reader: "In table-navigation mode (e.g. NVDA's table commands), moving through a row announces the column header with each cell: 'Case ID, 4471, link' then 'Case Name, Ridgeway Pumping Station, link' then 'Status, Open' then 'Last updated, Aug 14, 2026'. The header pairing means the bare number at the Case ID cell is never heard without context, and the two links are heard as distinct, meaningfully-labelled controls rather than a duplicated pair pointing at the same place."
  - keyboard: "Fully operable. Both links in a row are reachable by Tab in document order and each has a visible focus indicator; the table itself is not interactive and is not a tab stop."
  - low_vision: "Link text and header text meet contrast against the table's background; focus outline is visible at 3px with a 2px offset."
  - cognitive: "A user can scan the list by case number or by site name, using whichever label they remember, without having to learn that one column's link is 'really' the same as the other's."

notes: |
  This is the **CLEAN baseline** for SC 3.2.4 Consistent Identification, and the
  pair member of row-action-inconsistent-labels.

  Expected verdict: ACCEPT

  Provenance: GT-11. In one engagement, applying the "same functionality" scope
  from WCAG Understanding 3.2.4 to exactly this id/name-column shape collapsed
  candidate 3.2.4 rows from 103 to 25 — most of the collapsed rows were this
  fixture's pattern, not a real inconsistency.

  Why the BUG sibling exists: a CLEAN-only fixture would only prove a reviewer
  can stay silent on this specific false-alarm shape. It could not tell a
  correctly-scoped 3.2.4 reading apart from an exception worded so loosely that
  it also suppresses a genuine 3.2.4 violation (the same edit link labelled
  three different ways in row-action-inconsistent-labels). Only the pair
  together tests that the rule the critic applies is "same functionality,"
  not "never flag two links sharing a destination."

  Negative space — what an ACCEPT verdict here does NOT certify: this fixture
  is not evidence about scope attributes on tables in general (data-table-missing-scope
  already covers a missing-scope defect), about caption/aria-label choice beyond
  the one used here, or about any row action column — this table has none. It
  certifies exactly one thing: that two links in a row sharing a destination
  with different accessible names, where the two links are different
  functions, is not a 3.2.4 finding.
