notes: |
  Integration-plan eval item 5 (Lane A false-positive control), built
  2026-08-12 per the critic-round redefinition (the original fixture-5 slot
  was a Lane B shape mis-homed in a Lane A phase; the Lane B clean control
  moved to Phase 3 as fixture 4b).

  Control inventory:
  1. Zero findings → zero a11y_* tokens allowed anywhere in the response.
  2. Complete outcomes → no INCOMPLETE marker, no gap list, no invented
     "recommend further testing on X" gap entries in the document notes.
  3. All-passing map → supports everywhere except the nine not-applicable
     rows; a paranoid partially-supports anywhere is a term must-miss.
  4. 2.4.8 (AAA, evidenced passed) → supports in the AAA chapter; the
     remaining thirty AAA criteria stay not-evaluated. A blanket
     not-evaluated across all 31 AAA rows is a term must-miss on 2.4.8 —
     the AAA device covers absent evidence, never present evidence.
  5. The 2024 prior-platform contrast rumor (stakeholder email) is
     out-of-scope history: 1.4.3 stays supports; importing the rumor as a
     failure is caught by the expected-terms map.
  6. Value provenance: license withheld again ("leave unset"); JAWS/Dragon
     absent from the baseline.

  Known instrument limits: none beyond the suite-wide ones; this fixture
  exists to price false alarms, so misses here are read especially
  carefully before adjudication.
