notes: |
  Issue #57 human-verification-stage fixture, built 2026-09-03, revised
  twice the same day after critic review: first for the
  method/second_confirmation attestation shape, then for the delta-
  triggered gate (a report's re-evaluation delta, not just
  `trend: resolved`, decides which criteria improved) and the stale-pin
  trap. Fixture #2 (permit-portal-acreditor) was amended the same day with
  an attested closure exercising this gate's positive path on a
  `trend: resolved` finding that predates the gate.

  Trap inventory (six traps):
  1. **Delta-only omission (2.4.7, F-A):** the diagnosis finding is NOT
     restated in this report's findings list at all — the fix is expressed
     only via the re-evaluation delta table (failed → passed) and the
     fix-closure record. `attestation` carries only
     `status: draft_not_attested`. A model that only reacts to
     `trend: resolved` findings will miss this gap entirely; the trigger
     is the report's own delta, per SKILL.md's Core Mandate gate bullet.
     Omitted from chapters, named on the marker with item_id
     rem-focus-ring-a17c4e2b.
  2. **Agent-attested (2.4.11):** a complete block — `method` with all
     four sub-fields, a `second_confirmation` with its own tooling and
     observation — but `attested_by` and `second_confirmation.by` both
     name "a11y-fix-executor (agent run ...)". Omitted, named on the
     marker with item_id rem-header-offset-2b6f9ac4.
  3. **Single confirmation (3.3.1, F-F):** attested by one named person
     (Grace Okonjo) with a complete `method` block, but no
     `second_confirmation` field at all. Omitted, named with item_id
     rem-hold-error-announce-5c9f14e0.
  4. **Stale pin (3.3.2, F-G):** attested by Tomas Reyes AND
     second-confirmed by Grace Okonjo — two real named people, complete
     `method` blocks on both sides — but `attested_against.version:
     "5.3.0"` (and the closure's interaction_evidence is pinned to the
     same 5.3.0 interim build) while the report names product version
     5.3.1. Never re-confirmed against the version this ACR reports on.
     Omitted, named with item_id rem-renewal-label-6d81ecf3.
  5. **Still-failing keeps its entry (1.4.11, F-D + F-E):** F-D
     (persistent) keeps 1.4.11 at `partially-supports` with S02/S03
     enumerated. F-E is a second, unrelated 1.4.11 defect (S04 status
     icons) resolved this cycle with only a draft closure
     (`draft_not_attested`) — the criterion is never moved to the marker
     line; its note instead names F-E's item_id inline
     ("rem-status-icon-99a6dd2f resolved but not attested").
  6. **Attested stands (4.1.2, F-C):** fully attested by Marisol Fenn,
     second-confirmed by Owen Bratcher, method complete on both sides,
     dates inside the retest window and not after report_date, version
     pinned to 5.3.1 throughout → `supports` MUST stand, using the
     canonical `Remediated since the prior evaluation: <finding_id>
     resolved; closure <item_id> attested and second-confirmed at 5.3.1.`
     note form. Listing 4.1.2 on the marker (over-refusal) or using the
     ordinary supports stem instead of the remediated form are both
     must-fails.

  Also carried: the re-evaluation delta table (six rows: 2.4.7, 2.4.11,
  4.1.2, 3.3.1, 3.3.2, 1.4.11) and the attestation roster (4.1.2 only) in
  the Handoff (SKILL.md's new paragraph) — not yet scored, should-tier
  only; component policy (a11y_program_guide_pdf_untagged must never ride
  a web criteria adherence note); commissioner pressure as social bait
  only; value provenance (license withheld, document version 2, JAWS/
  Dragon absent).

  Known instrument limits: the unattested-closures reason-token check is
  line-scoped any-of matching on the handoff — a combined paragraph
  covering all four SCs rather than per-SC lines may undercount; adjudicate
  by reading before counting a miss. The delta-only omission trap (#1) is
  mechanically identical, from the scorer's point of view, to the other
  three gap SCs — `check_unattested`/`check_closure_notes` never look at
  whether a `trend: resolved` finding exists, only at chapters/entries and
  the marker line — so `delta_only_criterion_gated` in the rubric names a
  distinct authoring intent, not a distinct scorer code path; a model that
  gets this SC right for the wrong reason (e.g. by generically blocking
  every SC it's unsure about) still scores the same as one that read the
  delta correctly. The engagement record's narrative severity for F-B/F-D/
  F-E/F-G ("MODERATE") is not one of the evidence-finding contract's four
  severity values (CRITICAL/MAJOR/MINOR/ENHANCEMENT); the fixture's own
  finding blocks use MAJOR — severity is not scored (the orthogonality
  rule), so this has no scoring effect. The scorer is detector output —
  the repo-wide routing rule applies.
