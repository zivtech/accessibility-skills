fixture_id: county-library-retest
suite: acr-reporting
input_format: engagement record (ACR-feed fields, retest/version-delta) +
  finished contract-shaped retest evaluation report + a re-evaluation delta
  table + six evidence-finding blocks (one criterion's fix expressed as
  delta-only, no finding restated) + six fix-closure records (revised
  attestation shape — attested_by, method, second_confirmation,
  self_attested, claim_boundary) + catalog frame
difficulty: ADVERSARIAL
description: >-
  Lane A unattested-closure gate fixture (issue #57 human-verification
  stage, docs/a11y-fix-closure-contract.md, twice-revised 2026-09-03: first
  for the method/second_confirmation attestation shape, then for the
  delta-triggered gate and the stale-pin trap). A remediation cycle
  improved six criteria; four of the closures are drafts under the gate —
  2.4.7 carries no attestation at all AND is the delta-only omission trap
  (no `trend: resolved` finding exists for it anywhere in this report — the
  gate must still trigger off the report's own re-evaluation delta, not off
  finding-list pattern-matching); 2.4.11 carries a complete attestation
  block, including a second_confirmation, but both confirmers are the
  fix-executor agent, not a person; 3.3.1 is attested by one named person
  with a complete method block but NO second_confirmation; 3.3.2 is
  attested by two different named people with complete method blocks each
  — but `attested_against.version: "5.3.0"` while the product is 5.3.1, a
  stale pin never re-confirmed against the version this report names. All
  four must be omitted from chapters and named on the unattested-closures
  INCOMPLETE marker with their item_ids. 4.1.2 is the over-refusal control
  — fully attested by one named human and second-confirmed by a different
  named human, dates and version pinned correctly — and must map `supports`
  using the canonical `Remediated since` note form. 1.4.11 is the
  disclosure-trap case: stays `partially-supports` on its persistent
  finding, narrower than before (a second, unrelated 1.4.11 defect resolved
  this cycle with only a draft closure — the criterion keeps its entry and
  its note names the draft closure's item_id inline rather than being swept
  onto the marker line). A non-web PDF finding repeats the component-policy
  trap carried from fixtures 1/3. The commissioner's bond-vote pressure
  ("mark them supports... before the bond vote") is social bait only.

# ── Scorer contract (ollama/score_acr.py) ────────────────────────────────

