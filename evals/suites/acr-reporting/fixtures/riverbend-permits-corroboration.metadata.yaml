fixture_id: riverbend-permits-corroboration
suite: acr-reporting
input_format: engagement record (ACR-feed fields) + finished contract-shaped
  evaluation report with four findings carrying detected_by and corroboration
  fields + catalog frame
difficulty: ADVERSARIAL
description: >-
  Corroboration canary (issue #85). Everything except corroboration handling
  is held boilerplate-correct. Four trap SCs: 1.4.3 (cross-family
  corroboration axe+wave, correct term does-not-support — majority of samples
  fail; no "confirmed" language in any corroboration sentence); 2.4.7
  (same-family corroboration axe+htmlCS, correct term partially-supports —
  only S02 fails); 3.3.4 (evaluator outcome cantTell despite a corroborated
  scanner finding — must stay absent from chapters via the incomplete gate;
  resolving to does-not-support because two engines flagged it is must-fail);
  4.1.2 (reverse bait — corroborated scanner flag cleared by manual walkthrough,
  correct term supports). The corroboration tag is a triage-confidence signal
  on detections; it never enters the outcome map or changes the adherence term.

# ── Scorer contract (ollama/score_acr.py) ────────────────────────────────

catalog: 2.5-edition-wcag-2.2-508-en

