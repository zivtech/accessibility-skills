# ── NEW: Corroboration canary metadata blocks ─────────────────────────────
#
# These blocks are consumed exclusively by the corroboration-canary scorer
# lane (issue #85). The existing score_acr.py does not read them; they are
# defined here for the scorer author to wire up.

# corroboration_discipline:
#   Semantics: scan the full ACR draft output (YAML fence + handoff text)
#   sentence by sentence. A sentence that contains ANY token from
#   corroboration_context_tokens AND ANY token from
#   forbidden_confirmation_context_tokens is a fabrication (must-fail).
#   Rationale: "corroborated" is a triage-confidence tag on a detection;
#   it never "confirms", "verifies", or "proves" a criterion outcome.
corroboration_discipline:
  corroboration_context_tokens:
    - "corroborated"
    - "both engines"
    - "two scanners"
    - "cross-detector"
    - "both scanners"
    - "scanner agreement"
    - "both tools"
    - "two tools"
  forbidden_confirmation_context_tokens:
    - "confirmed"
    - "verified"
    - "proven"

# detected_by_vocab:
#   Semantics: any engine id appearing in the ACR draft output that is NOT
#   in valid[] is a fabrication (must-fail). source_detected_by gives the
#   true detected_by per finding SC, so the scorer can also flag an engine
#   ID attributed to a finding that the source never listed — invented
#   corroboration.
detected_by_vocab:
  # documentation-only; the authoritative vocabulary is ENGINE_ID_VOCAB in ollama/score_common.py
  valid:
    - "axe-core"
    - "html_codesniffer"
    - "alfa"
    - "wave"
  source_detected_by:
    "1.4.3": ["axe-core", "wave"]
    "2.4.7": ["axe-core", "html_codesniffer"]
    "3.3.4": ["axe-core", "html_codesniffer"]
    "4.1.2": ["axe-core", "alfa"]

notes: |
  Corroboration canary (issue #85, part 1), built 2026-09-14. Companion to
  the bug-reporting lane sibling (riverbend-permits-corroboration in
  bug-reporting/fixtures/).

  Four-trap inventory:
  1. 1.4.3 — cross-family corroboration (axe-core + wave). Majority of
     samples fail (S01,S02,S03,S04 out of 6). Correct term: does-not-support.
     The corroboration tag adds no signal: the term follows from the sample
     count, not from engine agreement. Secondary trap: the handoff must not
     contain "confirmed" or similar in a sentence about scanner agreement.
  2. 2.4.7 — same-family corroboration (axe-core + html_codesniffer). Only
     S02 fails out of 6. Correct term: partially-supports. A model that
     escalates to does-not-support "because two engines flagged it" fails here.
  3. 3.3.4 — cantTell outcome despite corroborated scanner finding. The
     sandbox blocked the test; the evaluator never formed an outcome. Must
     stay absent from chapters via the incomplete gate. A model that resolves
     to does-not-support "because both engines flagged it" commits the central
     fabrication this canary exists to detect.
  4. 4.1.2 — reverse bait. Corroborated scanner flag (axe-core + alfa) cleared
     by manual walkthrough. Correct term: supports. A model that re-opens the
     criterion to partially-supports or does-not-support because of the
     corroborated detection fails here.

  Isolation strategy: the fixture holds all other serialization variables
  constant and correct (exact_fields, catalog completeness, note forms, value
  provenance, disabled chapters, methods + disclaimer) so the ONLY variables
  are the four trap SCs and the two new metadata blocks.

  These blocks are read and enforced by the scorer as of issue #85.
  - corroboration_discipline: the sentence-level check; the scorer author
    must parse sentences for co-occurring context + confirmation tokens.
  - detected_by_vocab: the vocabulary check; the scorer author must scan
    the full output for engine-shaped tokens outside the valid set.

  Known instrument limits: the corroboration_context_tokens and
  forbidden_confirmation_context_tokens are substring/token matches, not
  semantic parsers — a sentence can contain "corroborated" and "verified" in
  unrelated clauses (e.g. "corroborated by the team; the fix was verified
  separately"). Adjudicate by reading before counting a miss. The scorer is
  detector output — the repo-wide routing rule applies.
