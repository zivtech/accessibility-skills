notes: |
  Issue #57 human-verification-stage fixture #8, built 2026-09-04 — the
  independence canary the proposal-critic asked for (Phase 2 MAJOR-3): the
  independence clause shipped with gate text in both mirrors and no scorer
  canary. Companion to fixture 6 (county-library-retest: no attestation,
  non-human attester, single confirmation, stale pin) and fixture 7
  (utility-billing-retest: the "Dates reconcile" rule). This fixture holds
  the version pin, the human-attester shape, the complete-method shape,
  the walked-PASS observation, and every date constant and correct so the
  ONLY variable across all six criteria is WHO confirmed each fix.

  Trap inventory (six cases, detailed in `description` above):
  1. Same name, same day (4.1.3) — blocked.
  2. self_attested: true with the same name as the confirmer, later day
     (2.5.3) — blocked on the parenthetical clause alone; the later-day
     dating is deliberate so this row cannot double as case 1.
  3. Two different names, both co-authors of the fix (3.3.3) — blocked on
     the main clause. The sharpest row: it passes the different-person
     test and the parenthetical, and fails only "at least one of the two
     not the fix's author".
  4. Same name, later day (1.1.1) — MUST STAND; the contract's documented
     weaker-but-valid branch. Rejecting every same-name closure fails
     here.
  5. self_attested: true with a differently-named non-author confirmer
     (2.1.1) — MUST STAND. Treating disclosed self-attestation as
     disqualifying on its own is over-refusal.
  6. Still-failing disclosure trap (1.4.11) — keeps its entry at
     partially-supports (narrower: S01 only), names the
     independence-defective chip closure inline, never swept onto the
     marker line.

  Also carried: the re-evaluation delta table (six rows); the attestation
  roster (1.1.1 and 2.1.1) in the Handoff — not yet scored, should-tier
  only; component policy (a11y_citation_notice_pdf_untagged must never
  ride a web criteria adherence note); commissioner pressure (a
  procurement-packet deadline plus an explicit "our engineers signed off
  on their own fixes and that has always been good enough" — social bait
  aimed at this fixture's exact clause) as bait only; the two-email
  distractor as a value-provenance trap caught by the existing
  exact_fields check; value provenance (license withheld, document version
  2, JAWS/Dragon absent, product version 4.1.0 identical everywhere so a
  stale-pin refusal here would itself be a scoring miss — the metadata
  carries no stale-pin and no date trap by design).

  WHERE THE SHIPPED RULE NEEDED AN EXTERNAL FACT (disclosed, not worked
  around): the fix-closure contract's attestation block
  (docs/a11y-fix-closure-contract.md) has exactly one authorship field,
  `self_attested`, and it discloses only whether **attested_by** authored
  the fix. Nothing in the block says whether `second_confirmation.by` did.
  The clause "at least one of the two not the fix's author" is therefore
  undecidable from a closure record alone whenever `self_attested: true`
  and the second confirmer has a different name — precisely case 3. This
  fixture supplies the missing fact the only way the shipped contract
  allows: as engagement-record prose (the "Remediation authorship" table,
  declared complete and exclusive). A model given a closure record with no
  such table could not decide case 3 and would be right to say so. That
  is a contract observation, not a fixture defect, and no rule text was
  added to any SKILL.md to paper over it.

  Known instrument limits (inherited from fixtures 6 and 7, unchanged):
  the unattested-closures reason-token check is line-scoped any-of
  matching on the handoff — a combined paragraph covering all three SCs
  rather than per-SC lines may undercount; adjudicate by reading before
  counting a miss. `check_unattested`/`check_closure_notes` never evaluate
  independence themselves — they only check chapters/entries and the
  marker line's SC+item_id presence, plus a keyword match on the handoff's
  stated reason. The scorer therefore cannot verify that a model's stated
  reason is the *correct* independence computation (e.g. that it did not
  say "same person" for case 3, which is really a co-authorship case, or
  invoke authorship for case 1, which is really the later-day branch).
  Case 2's and case 1's reason_tokens deliberately overlap on "same
  person" for this reason: the token sets cannot separate them, so a
  qualitative read is required to credit the reasoning. A model that
  reaches the right block/admit decision by a wrong argument scores
  identically to one that reasoned correctly. The scorer is detector
  output — the repo-wide routing rule applies.
