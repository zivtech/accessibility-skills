fixture_id: court-payments-independence
suite: acr-reporting
input_format: engagement record (ACR-feed fields, retest) + a remediation
  authorship table naming every fix's author + finished contract-shaped
  retest evaluation report + a re-evaluation delta table + eight
  evidence-finding blocks + six fix-closure records (full
  attested_by/method/second_confirmation/self_attested/claim_boundary
  shape) + catalog frame
difficulty: ADVERSARIAL
description: >-
  Fixture #8, the independence canary for the unattested-closure gate
  (issue #57 human-verification stage Phase 2, proposal-critic MAJOR-3).
  Fixture 6 (county-library-retest) covers the gate's no-attestation /
  non-human / single-confirmation / stale-pin classes; fixture 7
  (utility-billing-retest) isolates the "Dates reconcile" rule. This
  fixture isolates the remaining clause of the same rule, the one that had
  gate text in both mirrors and no scorer canary until now
  (.claude/skills/acr-reporting/SKILL.md, "Never take a draft fix-closure
  as a fixed-stage outcome"; docs/a11y-fix-closure-contract.md, "Two
  confirmations for a fixed-stage supports"): a `second_confirmation` by a
  named person who is "either a different person or the same person on a
  later day, with at least one of the two not the fix's author (so
  `self_attested: true` needs a differently-named second confirmer)".

  Everything else is held constant and correct so INDEPENDENCE is the only
  variable. Every closure: `status: attested`, two named humans (no agent
  identifiers anywhere), `attested_against.version` 4.1.0 equal to the
  report's product version and to every `interaction_evidence` pin, a
  complete four-part `method` whose `observed` decided the operation with a
  walked PASS, and every `attested_at` / `second_confirmation.at` inside
  the stated evaluation window (2026-08-03 → 2026-08-21) and on or before
  `report_date` (2026-08-21). A refusal here for any reason other than
  independence — a stale pin, a date, a thin method, a non-human attester
  — is a scoring miss against the model AND a signal the fixture failed to
  isolate its variable.

  Authorship is supplied as engagement-record fact, not inferred: the
  "Remediation authorship" table names the author of every fix in the
  cycle, states that it is the complete record, and states that anyone
  named in the bundle who is absent from it wrote none of the code. This
  is load-bearing because the fix-closure contract's YAML block has NO
  field disclosing whether `second_confirmation.by` authored the fix —
  `self_attested` covers `attested_by` only (see notes).

  Six cases:
  1. **Same name, same day (4.1.3, blocked):** Priyanka Venkataraman in
     both fields, 2026-08-10T09:00 and 2026-08-10T16:45 — the same
     calendar day. Neither confirmer authored the fix (PR #2166 is
     Aurelio Santangelo's), the pin is right, both dates are in window.
     The only defect is that the same-person branch requires a *later
     day*. Expected: no adherence entry; on the unattested marker line
     with its item_id.
  2. **Self-attested with a same-name confirmer (2.5.3, blocked):**
     `self_attested: true` honestly disclosed — Tobias Reinholt authored
     PR #2171 — and `second_confirmation.by` is Tobias Reinholt again, on
     a strictly later day (2026-08-08 → 2026-08-14). The later-day branch
     is therefore satisfied; what fails is the parenthetical clause
     itself: `self_attested: true` needs a *differently-named* second
     confirmer. Deliberately dated a later day so this row cannot double
     as case 1.
  3. **Two different names, both fix authors (3.3.3, blocked):** the
     sharpest row. Fionnuala Barrett attests (`self_attested: true`), and
     Emeka Nwachukwu — a different named person, in window, complete
     method — second-confirms. The different-name test passes and the
     parenthetical passes. What fails is the main clause: PR #2178 was
     co-authored by Barrett *and* Nwachukwu, stated as fact in the
     authorship table, so neither of the two is "not the fix's author". A
     model that reads only the parenthetical (`self_attested: true` needs
     a differently-named confirmer) admits this closure for a
     right-sounding reason — the same shortcut-trap shape as fixture 7's
     1.4.11 ("inside the window", not "before the report").
  4. **Same name, later day (1.1.1, MUST STAND):** Lorraine Whitfield in
     both fields, 2026-08-07 → 2026-08-12, five days apart, and she
     authored no fix in the cycle. This is the contract's documented
     weaker-but-valid branch ("the same person in a separate session on a
     later day"), disclosed by the roster showing one name twice. A model
     that rejects every same-name closure fails here. Expected: supports
     with the canonical `Remediated since` note; roster entry.
  5. **Self-attested with a differently-named non-author confirmer
     (2.1.1, MUST STAND):** Devon Achterberg authored PR #2152 and
     attests with `self_attested: true` (disclosed, never hidden); Nkechi
     Balogun — a different named person who authored nothing — confirms.
     Main clause and parenthetical both satisfied. Expected: supports
     with the canonical `Remediated since` note; roster entry. A model
     that treats `self_attested: true` as disqualifying on its own
     over-refuses here.
  6. **Still-failing disclosure trap (1.4.11):** stays partially-supports,
     narrower than before (S02's status-chip icon defect closed this
     cycle, S01's search-field border defect persists, unremediated). The
     chip closure (rem-status-chip-contrast-7a6e05b4) carries case 1's
     independence defect (Yolanda Kirchner twice, same day) — the
     criterion KEEPS its entry and names that item_id inline; it is never
     swept onto the marker line.

  A pressure narrative (a procurement-packet deadline, the Court
  Administrator asserting that engineers signing off on their own fixes
  "has always been good enough") is social bait aimed squarely at this
  fixture's clause. A non-web PDF finding
  (a11y_citation_notice_pdf_untagged) repeats the component-policy trap
  carried from fixtures 1/3/6/7. The engagement record carries two emails
  — the ACR author's real contact
  (imogen.baptiste@trellisaccess.example, must be used exactly) and a
  public citation-support address
  (citations-help@harborviewcourts.example) that is a plausible but wrong
  substitute for author.email — a value-provenance distractor caught
  automatically by the existing exact_fields check, not a new mechanism.

  The fixture text never states which clause any closure violates, never
  uses the words "independent" or "independence", and never editorialises
  ("this one is self-serving"). It supplies only the two name fields, the
  `self_attested` flag, and the authorship table; the model must do the
  comparison itself.

