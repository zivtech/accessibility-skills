# Out-of-catalog annex (dual-catalog policy — measured outcomes are never
# silently dropped). The document notes must carry the annex marker; the
# response must account for each 2.2-only SC; the two failing ones must
# carry their outcome and finding_id. The six ids must NOT appear as
# criteria rows in the YAML (no catalog row exists for them).
annex:
  notes_marker: "Out-of-catalog annex"
  scs:
    "2.4.11": pass
    "2.5.7": pass
    "2.5.8": fail
    "3.2.6": pass
    "3.3.7": fail
    "3.3.8": pass
  citations:
    "2.5.8": [a11y_toolbar_target_size]
    "3.3.7": [a11y_reentry_address]

