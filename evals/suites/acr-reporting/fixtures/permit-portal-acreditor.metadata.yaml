# Revised 2026-09-03 (unattested-closure gate, issue #57): 2.2.1's resolved
# finding now carries a fully attested, second-confirmed fix-closure
# record, so its supports note MUST use the canonical `Remediated since`
# form and cite the finding_id + item_id — the opposite of the pre-gate
# rule, which forbade any citation in a supports note. (Before 2026-09-03
# this key was `forbidden_citations: {"2.2.1": [a11y_session_timeout_no_warning]}`;
