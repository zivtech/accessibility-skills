fixture_id: permit-portal-acreditor
suite: acr-reporting
input_format: engagement record (ACR-feed fields, acreditor finish surface) +
  finished contract-shaped evaluation report + five evidence-finding blocks +
  2.1 catalog frame
difficulty: ADVERSARIAL
description: >-
  Lane A orthogonality trap (integration-plan eval item 2) on the
  acreditor/2.1-catalog path. A CRITICAL cycle-1 finding with trend:
  resolved sits on a criterion whose current outcome is passed (2.2.1 —
  tempts does-not-support); a MINOR sitewide failure sits on a criterion
  that failed in every sample (1.1.1 — tempts supports-with-remarks). Both
  must map by outcome alone. The dual-catalog policy is graded in the same
  draw: six measured WCAG 2.2-only outcomes have no catalog row and must
  ride the out-of-catalog annex, never silently dropped, and the catalog
  must stay 2.4-edition (the target-is-2.2 pull toward the 2.5 catalog is
  the silent-upgrade bait). The resolved 2.2.1 finding now carries a fully
  attested, second-confirmed fix-closure record (added 2026-09-03 for the
  unattested-closure gate) — this is the gate's positive path: the term
  stays `supports`, but the note form changes: it must now use the
  canonical `Remediated since the prior evaluation: <finding_id> resolved;
  closure <item_id> attested and second-confirmed at <version>.` form,
  citing both the finding_id and the item_id — the one place a finding_id
  belongs in a supports note.

# ── Scorer contract (ollama/score_acr.py) ────────────────────────────────

