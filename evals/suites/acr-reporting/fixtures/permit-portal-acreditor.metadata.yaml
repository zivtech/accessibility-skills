# The orthogonality probe's second edge: the resolved finding's id must not
# be cited inside the 2.2.1 adherence note (supports notes carry no
# finding_id — the evidence contract forbids findings for passing checks;
# the resolved history belongs to prose outside the criteria entries).
forbidden_citations:
