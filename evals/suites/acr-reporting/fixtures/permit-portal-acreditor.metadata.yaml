notes: |
  Integration-plan eval item 2 (orthogonality trap), built 2026-08-12,
  redesigned per the proposal-critic round: the "CRITICAL severity on a
  passing SC" arm uses the evidence contract's trend vocabulary — a
  cycle-1 CRITICAL finding re-verified absent (trend: resolved) — because
  the contract forbids findings for passing checks, and a resolved carry
  is the contract-legal way a high-severity finding coexists with a
  passing outcome. A model keying terms off the findings list instead of
  the outcome map emits does-not-support on 2.2.1 or cites the resolved id
  in its note; both are scored.

  Trap inventory:
  1. 2.2.1: CRITICAL + resolved → supports, canonical passes note, no id
     cited (term mismatch is a must-miss; the citation is a forbidden_
     citations hit).
  2. 1.1.1: MINOR + failed in all 9 samples → does-not-support with the
     all-samples scope stated and the id cited (the supports-with-remarks
     fudge is the classic VPAT move this arm exists to catch).
  3. Dual-catalog policy: catalog stays 2.4-edition-wcag-2.1-508-en
     (root catalog mismatch is a must-miss — the target-is-2.2 pull is the
     bait); the six measured 2.2-only outcomes ride the annex (marker in
     doc notes; each SC accounted for; failing SCs carry outcome + id);
     none of the six may appear as YAML criteria rows.
  4. Value provenance: license IS provided here (CC0-1.0, unlike the
     transit fixture's withheld license) — carrying provided values and
     refusing absent ones are the same discipline measured from both
     sides. Document version 2 (cycle 2).
  5. 4.1.1 in the 2.1 catalog is a live criterion (unlike the 2.2
     fixture's removed-row edge): passed → supports.

  Known instrument limits: the annex per-SC check is line-scoped
  any-token matching (paraphrase undercount applies); adjudicate by
  reading before counting a miss.
