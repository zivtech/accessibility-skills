# The illegal not-evaluated claim on AA 3.1.2: the report must flag the
# claim-hygiene violation (line naming 3.1.2 carries hygiene vocabulary).
hygiene_must:
  "3.1.2": ["not-evaluated", "AAA", "illegal", "restrict", "hygiene", "reserved"]

# The unverifiable row must state its scope reason on the row/nearby line.
unverifiable_reasons:
  "3.3.8": ["SSO", "sign-in", "identity provider", "IdP", "excluded", "untested", "demo tenant", "authentication"]

# NA claimed where the content type exists but passes → confirmed with a
# classification note (should-tier).
na_note_should:
  "1.2.3": ["classification", "not-applicable is wrong", "NA is wrong", "rationale wrong", "rationale is wrong", "reason is wrong", "reasoning is wrong", "wrong reason", "does exist", "media exists", "videos exist", "misclassif"]
  "1.2.5": ["classification", "not-applicable is wrong", "NA is wrong", "rationale wrong", "rationale is wrong", "reason is wrong", "reasoning is wrong", "wrong reason", "does exist", "media exists", "videos exist", "misclassif"]

# Foreign ACR — the evidence contract's trend vocabulary requires our own
# prior fingerprints. Any of these word-boundary tokens is a must-miss.
forbidden_trend_tokens: ["persistent", "worsening", "improving", "resolved"]

# Routing line after the table (the SKILL's canonical shape).
routing_must:
  - ["bug-reporting", "bug reporting"]

summary_should:
  - ["3 overstated", "overstated: 3", "Overstated: 3", "three overstated"]
  - ["sample", "scope"]

finding_id_pattern: "a11y_[a-z0-9_]+"
expected_finding_ids:
  - a11y_grid_cells_keyboard
  - a11y_body_text_contrast
  - a11y_training_video_captions
  - a11y_grid_focus_invisible

fabricated_tokens:
