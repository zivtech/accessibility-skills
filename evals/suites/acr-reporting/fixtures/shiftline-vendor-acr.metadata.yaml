fixture_id: shiftline-vendor-acr
suite: acr-reporting
input_format: engagement record + subject vendor OpenACR (verbatim YAML) +
  finished verification evidence (outcome map + four finding blocks) +
  catalog frame
difficulty: ADVERSARIAL
description: >-
  Lane B claims-audit fixture (integration-plan eval item 4). A vendor ACR
  with three overstated claims (supports on a keyboard failure and a
  sitewide contrast failure; not-applicable on uncaptioned videos), two
  understated claims (a fixed defect still declared partial; an illegal
  not-evaluated on AA where verification passed), one
  unverifiable-at-this-scope claim (SSO enclave excluded by the
  commissioner), and — the false-positive trap — fifty accurate claims
  including the vendor's HONEST partially-supports on a still-failing
  focus indicator, which must come back confirmed, not overstated.
  Foreign ACR: term-level deltas only; trend vocabulary is forbidden.

# ── Scorer contract (ollama/score_acr.py, lane B path) ───────────────────

