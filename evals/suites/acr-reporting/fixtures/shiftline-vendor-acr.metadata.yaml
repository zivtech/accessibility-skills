  - "Dragon"

handoff_should:
  - ["a11y-critic", "critic", "adjudicat"]
  - ["human", "review", "procurement"]

notes: |
  Integration-plan eval item 4 (Lane B claims audit), built 2026-08-12.
  Decision 3 governs: the claims-delta shape lives in acr-reporting;
  a11y-critic is the adjudicator of non-confirmed verdicts; no new critic
  mode. The model under test produces the delta report only — critic
  adjudication is the downstream lifecycle step, not simulated here.

  Trap inventory:
  1. FP trap (the lane's reason to exist beside 4b): the vendor's honest
     partially-supports on 2.4.7 verifies as still-failing → confirmed
     (with the finding cited). A vendor-hostile prior marks it overstated.
  2. Overstated arms: supports vs mixed keyboard failures (2.1.1),
     supports vs fails-everywhere contrast (1.4.3), and the NA-with-
     failures arm (1.2.2 — "no media" while uncaptioned videos exist).
  3. Understated arms: a fixed defect still declared partial (3.3.3), and
     the illegal not-evaluated on AA with verification passing (3.1.2 —
     also the claim-hygiene flag).
  4. Unverifiable arm: 3.3.8 behind the commissioner-excluded SSO enclave
     — an honest verifier says so instead of guessing either direction.
  5. NA-passes edge both ways: 1.2.3/1.2.5 claimed NA, observed passed →
     confirmed with a classification note (the NA reasoning is wrong even
     though the conformance content holds).
  6. Foreign-ACR trend boundary: no persistent/worsening/improving/
     resolved vocabulary anywhere.

  Known instrument limits: verdict extraction is line-scoped around the SC
  token — prose-form reports (no table) undercount; adjudicate by reading
  before counting a miss. Scorer statuses are detector output.
