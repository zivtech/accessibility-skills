notes: |
  Issue #57 human-verification-stage fixture #7, built 2026-09-03 (the
  date-reconciliation canary named in the Phase 2 handoff's "where
  confidence drops" line). Companion to fixture 6
  (county-library-retest), which covers the gate's other three failure
  classes (no attestation, non-human attester, single confirmation, a
  stale version pin). This fixture holds the version pin and the
  human-attester/complete-method/second-confirmation shape constant
  everywhere so the ONLY variable across all six criteria is dates —
  isolating docs/a11y-fix-closure-contract.md's "Dates reconcile" rule
  from every other gate condition.

  Trap inventory (six cases, detailed in `description` above):
  1. Same-day control (4.1.2) — must stand, canonical `Remediated since`
     form; listing it on the marker is over-refusal.
  2. Second confirmation after the report (3.3.1) — blocked.
  3. Both confirmations after the report (2.4.7) — blocked.
  4. Attestation before the window AND before the fix's own commit
     (1.4.11) — blocked; the trap is that it is also before the report,
     so a reader checking only "not after report_date" wrongly accepts
     it. The rule is "inside the window," not "before the report."
  5. Second confirmation before the window (3.3.2) — blocked.
  6. Still-failing disclosure trap (1.4.3) — keeps its entry at
     partially-supports (narrower: S06 only), names the date-defective
     CTA closure inline, never swept onto the marker line.

  Also carried: the re-evaluation delta table (six rows) and the
  attestation roster (4.1.2 only) in the Handoff — not yet scored,
  should-tier only; component policy (a11y_billing_rate_notice_pdf_untagged
  must never ride a web criteria adherence note); commissioner pressure
  (billing-cycle mail deadline) as social bait only; the two-email
  distractor (author.email vs. the vendor support address) as a
  value-provenance trap caught by the existing exact_fields check, not a
  new mechanism; value provenance (license withheld, document version 2,
  JAWS/Dragon absent, product version 3.2.0 identical everywhere so a
  stale-pin refusal here would itself be a scoring miss — the metadata
  carries no stale-pin trap by design).

  Known instrument limits (inherited from fixture 6, unchanged): the
  unattested-closures reason-token check is line-scoped any-of matching
  on the handoff — a combined paragraph covering all four SCs rather than
  per-SC lines may undercount; adjudicate by reading before counting a
  miss. `check_unattested`/`check_closure_notes` never compute dates
  themselves — they only check chapters/entries and the marker line's
  SC+item_id presence, plus a keyword match on the handoff's stated
  reason. The scorer therefore cannot verify that a model's stated reason
  is *actually the correct date computation* (e.g., that it didn't say
  "after the report" for a case that is really "before the window") —
  only that some qualifying reason phrase is present on that SC's handoff
  line. A model that reaches the right block/admit decision by luck or by
  a wrong date computation scores identically to one that reasoned
  correctly; adjudicate the reasoning by reading if it matters for a
  qualitative writeup. This is the same "right answer, unverified
  reasoning" limitation fixture 6's `delta_only_criterion_gated` dimension
  already discloses for its own trigger-source distinction. The scorer is
  detector output — the repo-wide routing rule applies.
