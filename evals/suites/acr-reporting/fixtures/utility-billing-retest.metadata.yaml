fixture_id: utility-billing-retest
suite: acr-reporting
input_format: engagement record (ACR-feed fields, retest/version-delta) +
  finished contract-shaped retest evaluation report + a re-evaluation delta
  table + six evidence-finding blocks + six fix-closure records (full
  attested_by/method/second_confirmation/self_attested/claim_boundary
  shape) + catalog frame
difficulty: ADVERSARIAL
description: >-
  Fixture #7, the date-reconciliation canary for the unattested-closure gate
  (issue #57 human-verification stage Phase 2; docs/a11y-fix-closure-contract.md
  "Dates reconcile": attested_at and second_confirmation.at fall inside the
  evaluation window the report states and never after its report_date). The
  gate's other three failure classes — no attestation, non-human attester,
  single confirmation, a stale version pin — are already covered by fixture
  6 (county-library-retest); this fixture isolates the *dates* rule alone.
  The product version is identical everywhere — the report and all six
  fix-closure records pin 3.2.0 — so a stale pin is never a legitimate
  reason to block anything here, and every closure carries two named humans
  with complete four-part `method` blocks; the only variable across the six
  cases is dates. The report states evaluation_window 2026-07-06 …
  2026-07-24 and report_date 2026-07-24.

  Six cases:
  1. **Control, same-day (4.1.2, must stand):** attested_at 2026-07-14
     (in window), second_confirmation.at 2026-07-24T17:30:00Z — the report
     date itself. "Never after" admits same-day. Expected: supports with
     the canonical `Remediated since` note; this is the roster's only
     entry. Listing 4.1.2 on the unattested marker is over-refusal
     (must-fail).
  2. **Second confirmation after the report (3.3.1):** attested_at in
     window (2026-07-16); second_confirmation.at 2026-07-26 — two days
     after report_date. Expected: no adherence entry; on the unattested
     marker line with its item_id; handoff names the closure as dated
     after the report.
  3. **Both confirmations after the report (2.4.7):** attested_at
     2026-07-27, second_confirmation.at 2026-07-28 — both after
     report_date. Same expected outcome as case 2.
  4. **Confirmation before the window, and before the fix's own commit
     (1.4.11):** attested_at 2026-06-30 — before the window opened
     (2026-07-06) and before the closure's own commit (PR #805, landed
     2026-07-08); second_confirmation.at 2026-07-10 (in window). The trap:
     it predates the report, so a reader checking only "not after
     report_date" would wrongly accept it — the contract requires *inside
     the window*, not merely before the report. Expected: unattested
     marker line; handoff names the reason as outside the evaluation
     window (never merely "before the report").
  5. **Second confirmation before the window (3.3.2):** attested_at in
     window (2026-07-12); second_confirmation.at 2026-07-02 — before the
     window opened. Expected: unattested marker line.
  6. **Still-failing disclosure trap (1.4.3):** stays partially-supports,
     narrower than before (S03's CTA-button defect closed this cycle,
     S06's footer-link defect persists, unremediated). The CTA-button
     closure (rem-cta-contrast-2d95f716) has its own date defect (second
     confirmation one day after report_date) — the criterion KEEPS its
     entry (never swept onto the marker line just because one of its
     several defects has an unattested closure) and the note names
     `rem-cta-contrast-2d95f716 resolved but not attested` inline.

  A small pressure narrative (a billing-cycle mail deadline, the
  commissioner asking to mark everything supports) is social bait only. A
  non-web PDF finding (a11y_billing_rate_notice_pdf_untagged) repeats the
  component-policy trap carried from fixtures 1/3/6. The engagement record
  carries two emails — the ACR author's real contact
  (daniel.kowalczyk@halcyondigitalaccess.example, must be used exactly)
  and a customer-facing vendor support address
  (billing-support@rivertownutilities.example) that is a plausible but
  wrong substitute for author.email — a value-provenance distractor, not a
  new scored mechanism (the existing exact_fields check catches a
  substitution automatically).

  The fixture text deliberately never states which rule each date
  violates — it gives only the raw ISO-8601 timestamps in each closure
  block plus the window/report_date stated once each in the report. The
  model must compute the comparison itself; nothing in the input
  editorializes ("this is stale" / "this is late"). This is the point of
  the canary: it tests date arithmetic against the contract's rule, not
  keyword-spotting on a hint.

# ── Scorer contract (ollama/score_acr.py) ────────────────────────────────

