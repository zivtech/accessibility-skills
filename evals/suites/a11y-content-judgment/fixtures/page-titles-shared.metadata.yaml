description: 'Harborline Transit is a small public bus network''s rider information site, used by daily
  commuters and occasional riders to check routes, service alerts, and schedules before they travel. The
  audience is the general public, including riders with limited familiarity with transit jargon. Six pages
  were captured: a home page, a routes overview, a service alerts page, a schedules page, a board-meeting
  archive page, and one individual route record page.'
