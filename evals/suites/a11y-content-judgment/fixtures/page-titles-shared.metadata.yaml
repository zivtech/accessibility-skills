- id: HEADING-TR-a47b836306
  type: heading
  sc: 2.4.6
  name: Get around town on Harborline Transit
  detail: h1
  href: null
  context: Harborline Transit operates twelve bus routes connecting the harbor district, the university,
    and the outlying neighborhoods. Buses run every ten to twenty minutes on weekdays and every thirty
    minute…
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-c29c834a39
  type: heading
  sc: 2.4.6
  name: Plan your trip
  detail: h2
  href: null
  context: Use the routes page to find a bus near you, or check the schedules page for departure times
    at your stop.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-1a808ddfc3
  type: heading
  sc: 2.4.6
  name: Service alerts
  detail: h2
  href: null
  context: Detours and delays are posted as soon as they are known. Check the alerts page before you head
    out during storms or major events.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-c84f23166c
  type: heading
  sc: 2.4.6
  name: Fares
  detail: h2
  href: null
  context: A single ride costs two dollars and fifty cents. Weekly and monthly passes are available at
    the harbor terminal ticket window and through the mobile app.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-1aa42a5fc1
  type: heading
  sc: 2.4.6
  name: Routes
  detail: h1
  href: null
  context: Harborline Transit runs twelve numbered routes across the city. Select a route below to see
    its full path and stops.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-a6550e29fb
  type: heading
  sc: 2.4.6
  name: Accessible vehicles
  detail: h2
  href: null
  context: Every bus in the fleet is equipped with a low floor and a fold-out ramp. Priority seating is
    available near the front doors.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-b752875c1e
  type: heading
  sc: 2.4.6
  name: Bike racks
  detail: h2
  href: null
  context: Each bus carries a two-bike rack on the front bumper at no extra charge.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-dc46e6a286
  type: heading
  sc: 2.4.6
  name: Service alerts
  detail: h1
  href: null
  context: Current detours and delays affecting Harborline Transit routes are listed below, most recent
    first.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-45f37a8853
  type: heading
  sc: 2.4.6
  name: Route 142 detour
  detail: h2
  href: null
  context: Bridge repairs have closed River Street between Third and Sixth. Route 142 buses are using
    Dock Street until repairs finish next month.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-69f6f95dde
  type: heading
  sc: 2.4.6
  name: Route 219 delays
  detail: h2
  href: null
  context: Expect delays of five to ten minutes on Route 219 during the morning commute while a signal
    is repaired at Northgate and Fifth.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-35dd816191
  type: heading
  sc: 2.4.6
  name: Holiday schedule
  detail: h2
  href: null
  context: All routes run on a reduced Sunday schedule for the harbor festival on the third weekend of
    the month.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-c5e0aa6521
  type: heading
  sc: 2.4.6
  name: Bus schedules
  detail: h1
  href: null
  context: Weekday and weekend departure times for every route are published here on the first of each
    month.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-c97713078b
  type: heading
  sc: 2.4.6
  name: Weekday service
  detail: h2
  href: null
  context: Buses depart the harbor terminal every ten minutes from six in the morning until seven at night,
    then every twenty minutes until midnight.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-3f0a64b190
  type: heading
  sc: 2.4.6
  name: Weekend service
  detail: h2
  href: null
  context: Saturday and Sunday buses run every thirty minutes from seven in the morning until midnight.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-4652fef5e8
  type: heading
  sc: 2.4.6
  name: Printable timetables
  detail: h2
  href: null
  context: A printable timetable for each route is available at the harbor terminal information counter.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-147880ef45
  type: heading
  sc: 2.4.6
  name: Board of Directors meeting minutes
  detail: h1
  href: null
  context: The Harborline Transit Authority board meets on the second Tuesday of each month. Minutes and
    public comment records are archived here going back ten years.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-33a9a458d2
  type: heading
  sc: 2.4.6
  name: Most recent meeting
  detail: h2
  href: null
  context: The board approved next year's operating budget and discussed the proposed extension of Route
    219 to the north industrial park.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-dff78f0100
  type: heading
  sc: 2.4.6
  name: Public comment
  detail: h2
  href: null
  context: Written comments may be submitted before any meeting through the contact page. Spoken comments
    are limited to three minutes per speaker.
  landmark: main
  visible: true
  views: 1
  flags: []
- id: HEADING-TR-423750c78c
