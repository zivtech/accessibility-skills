<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northbridge Water Quality Lab — Sample Submission</title>
</head>
<body>
<header>
<a href="/">Northbridge Water Quality Lab</a>
<nav>
<a href="/intake.html">Submit a Sample</a>
<a href="/reports.html">Reports</a>
</nav>
</header>
<main>
<h1>Submit a sample</h1>
<p>Complete the form below for each sample collected during today's rounds.
Submissions are reviewed within one business day.</p>
<form>
<p>
<input type="text" placeholder="Enter sample ID">
</p>
<p>
<label for="collected">Collection date</label>
<input type="date" id="collected">
</p>
<p>
<label for="tcli">TCLI</label>
<input type="number" id="tcli" step="0.1">
</p>
<p>
<label for="notes">Field notes</label>
<textarea id="notes"></textarea>
</p>
<p>
<button type="submit">Submit sample</button>
</p>
</form>
<section>
<h2>Look up a past submission</h2>
<p>
<input type="search" aria-label="Search past submissions">
<button type="button">Search</button>
</p>
</section>
</main>
<footer>
<p>Northbridge Water Quality Lab</p>
<a href="/contact.html">Contact</a>
</footer>
</body>
</html>
