fixture_id: dialog-dismiss-recipe-clean
suite: a11y-test-recipe
rubric_version: "1.0"
difficulty: CLEAN
scoring_method: hybrid
scorer: ollama/score_output.py
hybrid_weights:
  rule_based: 0.7
  llm_judge: 0.3

dimensions:
  - id: must_find
    name: "Must-Find Issues"
    description: "Instrument defects a competent reviewer of the recipe must find"
    weight: 3

  - id: should_find
    name: "Should-Find Issues"
    description: "The consequence a skilled reviewer draws from the must-find"
    weight: 2

  - id: nice_to_find
    name: "Nice-to-Find Issues"
    description: "Subtle gaps or optimizations"
    weight: 1

  - id: false_positive_trap
    name: "False Positive Avoidance"
    description: "Correctly avoiding flagging correct component decisions and correct recipe decisions"
    weight: -2

  - id: evidence_quality
    name: "Evidence Quality"
    description: "CRITICAL/MAJOR findings backed by file:line into the fixture or quotes from the run output"
    weight: 1

  - id: format_compliance
    name: "Format Compliance"
    description: "Opens with VERDICT: ACCEPT|REVISE; issues carry a severity and a citation"
    weight: 1

expected_findings:
  - category: must_find
    count: 0

  - category: should_find
    count: 0

  - category: nice_to_find
    count: 2
    items:
      - description: "Optional: Escape and Shift+Tab wrap are not exercised — coverage scope, not defects"
        severity: ENHANCEMENT
      - description: "Optional: `p:has-text(\"cannot be undone\")` could be `getByText(...)` for locator consistency — an equivalence, not a defect"
        severity: ENHANCEMENT

  - category: false_positive_trap
    count: 6
    items:
      - description: "The icon-only close button with aria-label='Close dialog' over an aria-hidden svg is correct — not a 2.5.3, 4.1.2, or 1.1.1 failure"
        impact: "Lines 96-100. No visible text label exists for 2.5.3 to apply to; the name is computed from aria-label; the svg is hidden and unfocusable."
        expected_to_find: "70%"
      - description: "The 'Close account' button behind the backdrop is not a defect and not a duplicate-name problem"
        impact: "Lines 22, 37-39: inside the inert root while the dialog is open; the recipe's dialog-scoped, exact-name locator would not reach it even if it were not."
        expected_to_find: "65%"
      - description: "`p:has-text(\"cannot be undone\")` (line 184) resolves — text-content matching is right for a text-bearing paragraph"
        impact: "Flagging every `:has-text()` on sight replaces selector reasoning with a lint rule; the selector is wrong only for elements whose name is not their text content."
        expected_to_find: "55%"
      - description: "`exact: true` on the close-control locator (line 188) is a deliberate tightening, not over-specification or brittleness"
        impact: "The default name match is a case-insensitive substring; `exact: true` excludes any other control whose name contains the phrase."
        expected_to_find: "60%"
      - description: "Initial focus on Cancel rather than the heading or the close control is a correct decision"
        impact: "Lines 60-62: the APG dialog pattern permits initial focus on the least destructive action; the heading is announced through aria-labelledby (:89)."
        expected_to_find: "55%"
      - description: "The six-press Tab bound and the 100 ms settle wait are recipe hygiene, not defects"
        impact: "Lines 190-196: two full cycles of a three-control dialog with the React-state settle the a11y-test method calls for; the trace shows the control reached on press 2."
        expected_to_find: "50%"

composite_score_formula: |
  score = sum(found_items * weight) / sum(all_positive_weights) * 100

scoring_thresholds:
  excellent: 90-100
  good: 75-89
  adequate: 60-74
  weak: 40-59
  poor: 0-39

expected_reviewer_performance:
  - condition: recipe-skill
    expected_score: 80-100
    reasoning: "Should ACCEPT with at most ENHANCEMENT notes; the slice's 'close buttons have descriptive aria-label' check and the detector-authority boundary steer it off the component traps."
  - condition: baseline-zero-shot
    expected_score: 50-90
    reasoning: "The exposure is lint-style flagging — `:has-text()` on the paragraph, `exact: true`, or the icon-only button — from a reviewer who wants to return something."

verdict_expectations:
  recipe-skill: ACCEPT
  baseline-zero-shot: ACCEPT

known_judgment_calls:
  - "ACCEPT-WITH-RESERVATIONS carrying only ENHANCEMENT items (Escape/Shift+Tab coverage, getByText consistency) is a correct verdict."
  - "A REVISE whose only issue is a coverage gap (e.g. 'the recipe should also press Escape') has mis-tiered scope as defect; adjudicate as a false alarm on verdict, not on content."
  - "Scorer statuses are detector output, not verdict authority. The traps are adjudicated by hand in the results README."

notes: |
  Provenance: GT-16 — CLEAN half. Independent public reference as the BUG
  half: Playwright's documented selector semantics.

  Under promotion-bar clause 3, this half exists so that the lane proves
  it leaves a correct recipe alone: a reviewer who has learned "`:has-text()`
  is wrong" from the BUG half must not apply it to a text-bearing target,
  and a reviewer who has learned "icon-only buttons are fine" must not
  then flag the deliberate `exact: true`.

  Negative space — what an ACCEPT here does NOT certify: Escape, Shift+Tab
  wrap, colour contrast, target size, the page beneath the dialog, or the
  recipe's behaviour against any other component.
