fixture_id: dialog-dismiss-recipe-clean
suite: a11y-test-recipe
name: Delete-Report Dialog — Keyboard Dismiss Recipe (name-derived selectors)
description: >-
  The same modal confirmation dialog, byte-identical component and CSS, with a
  keyboard test recipe whose selector for the icon-only close control is derived
  from the accessible-name inventory — `dialog.getByRole('button', { name:
  'Close dialog', exact: true })` — and the run output it produced: two
  operation-scoped PASS rows, a trace that reaches the control on the second
  Tab press, and a dismiss-and-return step that executed. Nothing is planted.
  The graded behaviour is leaving a sound recipe and a sound component alone.
language: jsx
framework: React
input_format: component + CSS + Playwright recipe + run output (stdout, trace.json, screen-reader-census.json, findings.json)
difficulty: CLEAN
domain: Test Instrument
work_type: recipe_review
fixture_revision: 3   # rev1 (cbd2f41): unplanted focus-return defect, census order, criterion-level PASS rows; rev2 (df05648): repaired; rev3: operation ids declared in the recipe (:189, :199), EB trimmed again (gate rev2)

expected_findings:
  - category: must_find
    count: 0
    notes: "No defects. The recipe's control-under-test selector is role+name from the census row, every assertion executed, and the filed PASS rows are scoped to their operations and cite the trace steps that support them."

  - category: should_find
    count: 0

  - category: nice_to_find
    count: 3
    items:
      - description: "Optional: the recipe does not exercise Escape or Shift+Tab wrap — scope, not defects; a reviewer who lists them as ENHANCEMENT coverage gaps is being thorough rather than wrong"
        severity: ENHANCEMENT
      - description: "Optional: `p:has-text(\"cannot be undone\")` could be `getByText('cannot be undone')` for consistency with the other locators — an equivalence, not a defect; both resolve a text-bearing element by its text"
        severity: ENHANCEMENT
        note: "Scored here so that a reviewer who mentions it as a style preference is not confused with one who flags it as a broken selector (trap 3)."
      - description: "Optional: the recipe cannot distinguish 'dismissed' from 'deleted and dismissed' — a close button miswired to onConfirm would pass every assertion; asserting the report is still listed after dismissal is the cheap high-value addition"
        severity: ENHANCEMENT
        note: "Coverage gap, not a false claim: the component is wired correctly (:95, onCancel). Raised by the rev1 baseline draw; scored so that raising it as ENHANCEMENT is credited and raising it as a defect is not."

  - category: false_positive_trap
    count: 7
    items:
      - description: "The icon-only close button with aria-label='Close dialog' over an aria-hidden svg is correct — not a 2.5.3, 4.1.2, or 1.1.1 failure"
        impact: "Lines 95-99. No visible text label exists for 2.5.3 to apply to; the name is computed from aria-label; the svg is hidden and unfocusable."
      - description: "The 'Close account' button behind the backdrop is not a defect and not a duplicate-name problem"
        impact: "Lines 17, 32-34: it is inside the inert root while the dialog is open, so it is neither tabbable nor in the accessibility tree; the recipe's dialog-scoped, exact-name locator would not reach it even if it were exposed."
      - description: "`p:has-text(\"cannot be undone\")` (line 183) resolves — text-content matching is exactly right for a text-bearing paragraph"
        impact: "A review that flags every `:has-text()` on sight has replaced selector reasoning with a lint rule. The selector is wrong only for elements whose name is not their text content, which the paragraph is not."
      - description: "`exact: true` on the close-control locator (line 187) is a deliberate tightening, not over-specification or brittleness"
        impact: "The default name match is a case-insensitive substring; `exact: true` excludes any other control whose name contains the phrase. Calling it brittle, or recommending the substring default as an improvement, is a false alarm either way."
      - description: "Initial focus on Cancel rather than the heading or the close control is a correct decision; focus return from the effect cleanup is correct, not a race"
        impact: "Lines 56-61: the APG dialog pattern permits initial focus on the least destructive action; the heading is announced through aria-labelledby (:88). The cleanup return (:58-60) runs after the parent commit that removes `inert` (:17), which is exactly why it is not inside the handler."
      - description: "The six-press Tab bound and the 250 ms settle wait are recipe hygiene, not defects"
        impact: "Lines 190-196: two full cycles of a three-control dialog, with a settle inside the 200–500 ms range the a11y-test method states for React state after a key press; the trace shows the control reached on press 2."
      - description: "The two PASS rows are operation-scoped, not conformance claims — flagging them as 2.1.1 / 2.4.3 over-claims is a false alarm"
        impact: "Lines 251 and 261: each row carries a claim_boundary naming the operation, route and viewport and disclaiming a criterion-level verdict; the operation ids are the ones the recipe declares above its assertions (:189, :199); the wcag field records the criterion the operation bears on. A review that reads the rows as 'this dialog conforms to 2.1.1' has read past the boundary the rows state."

wcag_criteria:
  - "2.1.1 Keyboard (operation OP-CLOSE-REACH PASS, from trace step 2; not a criterion verdict)"
  - "2.4.3 Focus Order (operation OP-CLOSE-DISMISS PASS, from trace step 3; not a criterion verdict)"

multi_perspective_coverage:
  - screen_reader: "The close control announces 'Close dialog, button'; the dialog announces its heading through aria-labelledby and its description through aria-describedby."
  - keyboard: "Tab reaches the close control on the second press; Enter on it dismisses and returns focus to the trigger (trace step 3)."
  - low_vision: "Not affected."
  - cognitive: "Not affected."

notes: |
  Provenance: GT-16 (wave 2, fixture-first) — the CLEAN half of the
  `dialog-dismiss-recipe` pair. Independent public reference as the BUG
  half: Playwright's documented selector semantics.

  Expected verdict: ACCEPT, carrying at most ENHANCEMENT items. The task
  prefix offers only ACCEPT and REVISE; the scorer also accepts
  ACCEPT-WITH-RESERVATIONS if a model emits it unprompted.

  The component is byte-identical to the BUG half's, so any component
  finding a reviewer raises here is a false alarm — the BUG half's traps
  1-4 recur here as traps 1, 2, 5, 6 — and the recipe adds three more: a
  `:has-text()` that is correct because its target is text-bearing, an
  `exact: true` that is correct because it is deliberate, and PASS rows
  that are correct because they say what they do and do not claim.
  Authored under the issue #51 blind envelope: no "Accessibility Features
  Present" section precedes the cut line, and (rev2) Expected Behavior no
  longer pre-argues the traps.

  Revision history. rev1 (cbd2f41) was NOT clean: the shared component
  restored focus inside the handler while `#app-root` still carried
  `inert`, so focus fell to <body> on dismissal and the trace's step 3 and
  the 2.4.3 PASS row recorded behaviour the component could not produce.
  A blind baseline draw (REVISE, correctly) and the bench-reviewer gate
  both caught it. rev2 restores focus from the dialog's effect cleanup;
  the census is in DOM order; the PASS rows carry claim_boundary; the
  settle is 250 ms; the second PASS row cites both assertion lines.
  Receipts: evals/results/gt16-dialog-dismiss-recipe/.

  Negative space — what an ACCEPT here does NOT certify: Escape, Shift+Tab
  wrap, colour contrast, target size, the page beneath the dialog, or the
  recipe's behaviour on any component other than this one.
