fixture_id: dialog-dismiss-recipe
suite: a11y-test-recipe
name: Delete-Report Dialog — Keyboard Dismiss Recipe
description: >-
  A keyboard test recipe for a modal confirmation dialog, with the run output it
  produced: a filed 2.1.1 FAIL saying the dialog's close control is never reached
  by Tab. The component is correct. The recipe located the icon-only close
  control with `button:has-text("Close")`, which matches rendered text content,
  not accessible names — so it bound to the page's inert "Close account" button
  and watched that element while the trace recorded focus on "Close dialog"
  twice. The graded judgment is recognising the selector-semantics defect,
  deriving the selector from the accessible-name inventory instead, and
  withdrawing the filed FAIL as an instrument artifact rather than ratifying it.
language: jsx
framework: React
input_format: component + CSS + Playwright recipe + run output (stdout, trace.json, screen-reader-census.json, findings.json)
difficulty: HAS-BUGS
domain: Test Instrument
work_type: recipe_review
fixture_revision: 3   # rev1 (cbd2f41): unplanted focus-return defect + census order; rev2 (df05648): repaired; rev3: operation ids declared in the recipe, withdrawal tokens trimmed + polarity window (gate rev2)

expected_findings:
  - category: must_find
    count: 1
    items:
      - description: "has-text text-content selector mismatch — `button:has-text(\"Close\")` matches rendered text content, so it cannot resolve the icon-only close control whose name is `aria-label`; the call log shows it bound to the inert 'Close account' button; the filed FAIL is an instrument artifact and is withdrawn, not ratified"
        # Conjunction of three any-of groups (score_output.py keywords_all): a
        # review must name the semantics, name the remedy or the name source,
        # AND withdraw the filed FAIL. One item, so a ratifying review cannot
        # half-earn it under the 0.4 abort threshold.
        keywords_all:
          - ["has-text", "hastext", "rendered text", "text content", "textcontent", "visible text"]
          - ["getbyrole", "getbylabel", "by role", "accessible name", "accname", "aria-label"]
          # finding-directed withdrawal only; bare negative-capability words (unsupported, does not support, spurious) removed after gate rev2 C-1 — the scorer discards any occurrence preceded by a negation within four words
          - ["withdraw", "retract", "refute", "contradict", "cannot be filed", "should not be filed", "must not be filed", "not be filed", "before any outcome is filed", "before anything is filed", "false positive", "false fail", "fabricated", "invalid measurement", "invalid finding", "finding is invalid", "instrument artifact", "selector artifact", "not a component defect", "no component defect", "not a defect in the component", "not in the component", "misattributed", "mis-attributed", "does not exist"]
        severity: CRITICAL
        wcag: "n/a — instrument defect, not a criterion: Playwright selector semantics (`:has-text()` = text content; role locators = ARIA accessible name)"
        evidence: "dialog-dismiss-recipe.md:185 (the selector); :226 (call log: locator resolved to <button class=\"account__close\">Close account</button>); :95-99 (the control's name is aria-label over an aria-hidden svg, no text content); :261 (census row: role button, name \"Close dialog\"); :275 (outcome FAIL) against :247 and :250 (trace: focus on \"Close dialog\")"
        user_group: "Nobody directly — the defect is in the instrument. Its downstream victims are the developers who receive a false 2.1.1 defect, and the keyboard users whose real defects go untested while the suite chases this one"
        expected_behavior: "Selectors for the control under test are derived from its accessible name — `dialog.getByRole('button', { name: 'Close dialog', exact: true })` or `getByLabel('Close dialog')` — using the census the run already produced; the FAIL is withdrawn and the recipe re-run before anything is filed"
        fix: "Replace the `:has-text()` locator with the role+name locator from the census row; mark the finding withdrawn; re-run. Do not add visible text to the button to make the old selector work — that changes the component to fit the instrument"

  - category: should_find
    count: 1
    items:
      - description: "trace steps 2 and 5 cited as the contradiction — the review points at the specific trace rows that record focus on { role: button, name: \"Close dialog\" }, not just at the FAIL"
        keywords_all:
          - ["trace"]
          - ["step 2", "steps 2", "step 5", "steps 5", "press 2", "second press", "second tab", ":247", ":250", "line 247", "line 250", ":249", ":252"]   # fixture-relative and prompt-relative (+2: the task prefix is prompt lines 1-2)
        severity: MAJOR
        wcag: "2.1.1 Keyboard (the criterion the finding wrongly cites — the evidence shows the control reachable)"
        evidence: "dialog-dismiss-recipe.md:247, :250 (focus_after name \"Close dialog\"); :280 (the finding cites trace steps 1-6 as its own evidence)"
        user_group: "Developers receiving the finding; the keyboard users a wasted fix cycle does not help"
        expected_behavior: "The withdrawal is argued from the trace rows themselves, so the developer reading the review can verify it without re-running"
        fix: "Quote the trace steps in the withdrawal note"

wcag_criteria:
  - "2.1.1 Keyboard (cited by the filed finding; not violated by the component on this evidence)"

multi_perspective_coverage:
  - screen_reader: "Not affected by the component: the close control announces 'Close dialog, button'. Affected by the instrument: a suite built on text-content selectors systematically skips every icon-only control that screen reader users rely on aria-label for."
  - keyboard: "Not affected by the component: Tab reaches the close control on the second press of every cycle (trace steps 2, 5). The filed FAIL would send a developer to 'fix' reachability that already works."
  - low_vision: "Not affected."
  - cognitive: "Not affected."

notes: |
  Provenance: GT-16 (wave 2, fixture-first). Independent public reference:
  Playwright's documented selector semantics — `:has-text()` "matches any
  element containing specified text somewhere inside … Matching is
  case-insensitive, trims whitespace and searches for a substring"
  (docs/other-locators, "CSS: matching by text"); role locators "follow W3C
  specifications for ARIA role, ARIA attributes and accessible name", and
  `getByRole`'s `name` option matches the accessible name, substring and
  case-insensitive unless `exact: true` (docs/locators; api/class-page).
  Verified against playwright.dev on 2026-09-03.

  Expected verdict: REVISE (the recipe must change before its outcome can
  be filed). A REVISE that blames the component is the wrong REVISE — see
  the rubric's false-positive traps.

  This fixture measures a test-instrument judgment, not a component one:
  the component is correct throughout. It is the first pair in the bundle
  whose defect surface is the recipe, and it is authored under the blind
  envelope proposed in issue #51 — no "Accessibility Features Present"
  section precedes the cut line, and (rev2) the Expected Behavior section
  no longer states the inert root, the initial-focus choice, or the
  three-control cycle, so the traps are not pre-argued to the model.

  Revision history. rev1 (cbd2f41) shipped an unplanted component defect:
  focus was restored to the trigger inside the click/keydown handler,
  while `#app-root` still carried `inert` (React 18 flushes the state
  update after the handler returns), so the focus call was a no-op and
  focus fell to <body> on every dismissal. A blind baseline draw and the
  bench-reviewer gate both caught it; rev2 restores focus from the
  dialog's effect cleanup, which runs after the commit that removes
  `inert`. rev1 also listed the census out of DOM order (close button
  before heading) — repaired. Receipts: evals/results/gt16-dialog-dismiss-recipe/.

  Scoring note: the must-find is one item built from three any-of groups
  (score_output.py `keywords_all`, list entries = any-of). The gate's
  probes against rev1 — a review that ratifies the FAIL with a getByRole
  "nit" (had semantics + remedy, no withdrawal), a scope-it-to-the-dialog
  review phrased with "text content" (no remedy, no withdrawal), and a
  fully correct review that never typed the literal `has-text` (rev1
  scored it 0/1) — all score as they should under rev2. Proof:
  evals/results/gt16-dialog-dismiss-recipe/canaries.py. The rev2 gate
  then showed the withdrawal group was still too wide — "the dialog does
  not support keyboard access" is the modal phrasing of a RATIFYING review
  and scored the must-find; rev3 keeps only finding-directed forms
  (withdraw / refute / contradict / cannot be filed / false positive …) and
  the scorer discards any occurrence preceded by a negation within four
  words ("not a false positive", "does not contradict", "not spurious").
  Residual class: a ratifying review that uses a finding-directed token
  affirmatively in another sense ("the trace contradicts nothing"); and
  the "withdraws then certifies the dialog" over-claim, which the scorer
  cannot see — both are hand adjudication (known_judgment_calls).
