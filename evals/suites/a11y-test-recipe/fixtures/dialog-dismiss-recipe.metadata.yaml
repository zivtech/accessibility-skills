fixture_id: dialog-dismiss-recipe
suite: a11y-test-recipe
name: Delete-Report Dialog — Keyboard Dismiss Recipe
description: >-
  A keyboard test recipe for a modal confirmation dialog, with the run output it
  produced: a filed 2.1.1 FAIL saying the dialog's close control is never reached
  by Tab. The component is correct. The recipe located the icon-only close
  control with `button:has-text("Close")`, which matches rendered text content,
  not accessible names — so it bound to the page's inert "Close account" button
  and watched that element while the trace recorded focus on "Close dialog"
  twice. The graded judgment is recognising the selector-semantics defect,
  deriving the selector from the accessible-name inventory instead, and
  withdrawing the filed FAIL as an instrument artifact rather than ratifying it.
language: jsx
framework: React
input_format: component + CSS + Playwright recipe + run output (stdout, trace.json, screen-reader-census.json, findings.json)
difficulty: HAS-BUGS
domain: Test Instrument
work_type: recipe_review

expected_findings:
  - category: must_find
    count: 1
    items:
      - description: "has-text text-content selector mismatch — `button:has-text(\"Close\")` matches rendered text content, so it cannot resolve the icon-only close control whose name is `aria-label`; the call log shows it bound to the inert 'Close account' button"
        keywords_all: ["has-text"]
        keywords_any: ["getbyrole", "getbylabel", "accessible name", "text content", "textcontent"]
        severity: CRITICAL
        wcag: "n/a — instrument defect, not a criterion: Playwright selector semantics (`:has-text()` = text content; role locators = ARIA accessible name)"
        evidence: "dialog-dismiss-recipe.md:186 (the selector); :225 (call log: locator resolved to <button class=\"account__close\">Close account</button>); :96-100 (the control's name is aria-label over an aria-hidden svg, no text content); :255 (census row: role button, name \"Close dialog\")"
        user_group: "Nobody directly — the defect is in the instrument. Its downstream victims are the developers who receive a false 2.1.1 defect, and the keyboard users whose real defects go untested while the suite chases this one"
        expected_behavior: "Selectors for the control under test are derived from its accessible name — `dialog.getByRole('button', { name: 'Close dialog', exact: true })` or `getByLabel('Close dialog')` — using the census the run already produced"
        fix: "Replace the `:has-text()` locator with the role+name locator from the census row; re-run. Do not add visible text to the button to make the old selector work — that changes the component to fit the instrument"

  - category: should_find
    count: 1
    items:
      - description: "trace contradicts the filed FAIL — steps 2 and 5 record focus on { role: button, name: \"Close dialog\" }, so the 2.1.1 finding is an instrument artifact and must be withdrawn, not ratified"
        keywords_all: ["trace"]
        keywords_any: ["artifact", "instrument", "withdraw", "retract", "false", "not supported", "unsupported", "does not support", "contradict"]
        severity: CRITICAL
        wcag: "2.1.1 Keyboard (the criterion the finding wrongly cites — the evidence shows the control reachable)"
        evidence: "dialog-dismiss-recipe.md:242, :245 (focus_after name \"Close dialog\"); :270 (outcome FAIL); :274 (the finding cites trace steps 1-6 as its own evidence)"
        user_group: "Developers receiving the finding; the keyboard users a wasted fix cycle does not help"
        expected_behavior: "A review withdraws the FAIL and re-runs with a corrected selector; it does not certify the dialog either — the dismiss and focus-return assertions never executed"
        fix: "Mark the finding withdrawn (instrument artifact), re-run the corrected recipe, file from the re-run"

wcag_criteria:
  - "2.1.1 Keyboard (cited by the filed finding; not violated by the component on this evidence)"

multi_perspective_coverage:
  - screen_reader: "Not affected by the component: the close control announces 'Close dialog, button'. Affected by the instrument: a suite built on text-content selectors systematically skips every icon-only control that screen reader users rely on aria-label for."
  - keyboard: "Not affected by the component: Tab reaches the close control on the second press of every cycle (trace steps 2, 5). The filed FAIL would send a developer to 'fix' reachability that already works."
  - low_vision: "Not affected."
  - cognitive: "Not affected."

notes: |
  Provenance: GT-16 (wave 2, fixture-first). Independent public reference:
  Playwright's documented selector semantics — `:has-text()` "matches any
  element containing specified text somewhere inside … Matching is
  case-insensitive, trims whitespace and searches for a substring"
  (docs/other-locators, "CSS: matching by text"); role locators "follow W3C
  specifications for ARIA role, ARIA attributes and accessible name", and
  `getByRole`'s `name` option matches the accessible name, substring and
  case-insensitive unless `exact: true` (docs/locators; api/class-page).
  Verified against playwright.dev on 2026-09-03.

  Expected verdict: REVISE (the recipe must change before its outcome can
  be filed). A REVISE that blames the component is the wrong REVISE — see
  the rubric's false-positive traps.

  This fixture measures a test-instrument judgment, not a component one:
  the component is correct throughout. It is the first pair in the bundle
  whose defect surface is the recipe, and it is authored under the blind
  envelope proposed in issue #51 — no "Accessibility Features Present"
  section precedes the cut line, so the traps are not pre-argued to the
  model.

  Scoring note: this rubric uses the explicit `keywords_all` /
  `keywords_any` fields added to score_output.py for this lane. The
  first-four-words fallback is polarity-blind here — any review that
  quotes the selector would score the must-find. `keywords_all:
  ["has-text"]` alone would still credit a review that says "scope
  `:has-text("Close")` to the dialog" (the wrong diagnosis), so the
  any-list demands the semantics or the remedy as well. Proof:
  evals/results/gt16-dialog-dismiss-recipe/canaries.py.
