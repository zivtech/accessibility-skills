# Fixture title manifest — what the H1 gives away before the blind cut line
#
# The blind protocol (ollama/run_benchmark.py:strip_answer_key) hides the answer
# key by cutting at `## Accessibility Issues`. Line 1 of every fixture is above
# that cut, so the H1 reaches the model in every prompt-based lane.
#
# This file makes each title's leak status an explicit, reviewable declaration
# instead of an unexamined convention. `ollama/test_blind_prompts.py` fails CI
# when a fixture has no row here, or when its H1 no longer matches `title` — so
# a new fixture cannot land a defect-naming title silently, and an existing one
# cannot drift.
#
#   class: neutral        — names the component/context only
#          names-defect   — states or strongly implies the planted defect
#          asserts-feature — asserts the accessibility feature under test is present
#                            (the CLEAN-side mirror of names-defect)
#
# `neutral_title` is the neutralised variant used by the title-hint measurement
# (issue #51 step 2). Each one is derived by DELETING the defect/feature clause
# from the existing title — never by adding information that would need the
# fixture body to verify.
#
# Every non-neutral row is a disclosed residual, not an accepted design: the
# measurement decides whether they get applied to the corpus. See issue #51.

