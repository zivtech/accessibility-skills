# ICT Testing Baseline — machine-readable test-ID manifest
#
# Phase 0 deliverable of docs/ict-testing-baseline-adoption-assessment.md; human-readable
# companion: docs/ict-testing-baseline-reference.md. Ground truth for baseline-test-ID
# validity checking (the Phase 3 fabrication scorer) and the Phase 2 coverage crosswalk.
# An ID is valid only within its baseline: the two baselines share the ID grammar but
# diverge (11.A-PageTitled is web-only; 11.A-DocumentTitled is documents-only).
#
# Originating source (cited per the license's citation condition): ICT Testing Baseline
# Portfolio, authored under the Federal CIO Council Accessibility Community of Practice
# (ACOP, https://www.cio.gov/about/accessibility-cop/), maintained by the ICT Testing
# Baseline Working Group; distributed at https://ictbaseline.access-board.gov/ and
# https://github.com/atbcb/ICTTestingBaseline (LICENSE, 2018, grants use/copy/modify/
# publish subject to citing the ACOP as originating source including the URL).
# Per that license, modifications are not attributable to ACOP: the `classification`
# and `classification_note` fields are THIS repository's provisional hand judgment
# (2026-08-12), expected to be superseded if the upstream ACT mapping branch
# (kengdoj-BaselinetoACT) publishes. Everything else restates published upstream content.
meta:
  retrieved: "2026-08-12"
  published_pages:
    web: https://ictbaseline.access-board.gov/allwebbaselines.html
    documents: https://ictbaseline.access-board.gov/alldocsbaselines.html
  pin:
    repo: atbcb/ICTTestingBaseline
    main_sha: 6c537a3b79992237b6edb9b0b608730d8da8cdef
    main_sha_committed: "2026-07-24"
    last_baselines_content_commit: "fc8fb9b1b 2026-02-05 (#570, Appendix A 18.A meaningful-content addition)"
    nearest_release_tag: "v3.1, 2024-04-01, b0e0fe2e2ba728cd87380e1181ece450297f1938 (the rendered site is not the tag; the SHA is the identity)"
    site_self_label_web: "version 3.1 (published April 1, 2024)"
    site_self_label_documents: "Version 1.0 (published September 30, 2024)"
  id_grammar: "<family-number>.<letter>-<CamelCaseName>"
  classification_values: [machine-evaluable, tool-assisted, judgment-only, always-passes]
  # Strings that look like test IDs and appear in published page text but are NOT valid
  # IDs *in the baseline of the page they appear on*. A validity check is per-baseline:
  # 15.A-LanguagePage / 15.B-LanguagePart are valid WEB IDs leaked into the documents
  # page's Test Results sentences (cross-baseline confusables); the other two are valid
  # nowhere. All four occur verbatim upstream — reject them for the cited baseline anyway.
  invalid_id_strings_on_published_pages:
    - {string: 21.B-AutoUpdate, page: web, where: "21.C Test Results sentence", valid_id: 21.C-AutoUpdate, valid_elsewhere: false}
    - {string: 5.A-Control, page: documents, where: "5.A Test Results sentence (space typo: '5.A-Control Name')", valid_id: 5.A-ControlName, valid_elsewhere: false}
    - {string: 15.A-LanguagePage, page: documents, where: "15.A Test Results sentence", valid_id: 15.A-LanguageDocument, valid_elsewhere: "valid in the web baseline"}
    - {string: 15.B-LanguagePart, page: documents, where: "15.B Test Results sentence", valid_id: 15.B-LanguageParts, valid_elsewhere: "valid in the web baseline"}
  retired_sections:
    - {page: web, heading: "18.A for Test Procedure for Meaningful Background Image", status: "retired stub (v3.1) — content now under 6.B-DecorativeImage; declares no test ID; heading typo is upstream"}
