# ICT Testing Baseline (Web) → a11y-test execution-mode coverage crosswalk
#
# Phase 2 deliverable of docs/ict-testing-baseline-adoption-assessment.md. Maps every
# active web baseline test at the pinned upstream state to the execution mode(s) that
# produce evidence for it and the artifact that evidence takes, with honest NOT-COVERED
# rows. HAND-BUILT against docs/ict-testing-baseline-reference.md and the per-test
# instructions' SC basis — never regenerate mechanically; a generated crosswalk without
# value-checking is the exact-ID fabrication failure mode by construction. Rebuild by
# hand on the reference doc's recheck triggers.
#
# ID ground truth: docs/ict-baseline-test-id-manifest.yaml (62 active web tests at
# atbcb/ICTTestingBaseline main @ 6c537a3b, 2026-08-12). Every id below must exist in
# that manifest's web list; the manifest also carries each test's WCAG 2.0/508 basis and
# this repo's provisional classification — not duplicated here to avoid drift.
#
# Originating source (cited per the upstream license's citation condition): ICT Testing
# Baseline Portfolio, authored under the Federal CIO Council Accessibility Community of
# Practice (ACOP, https://www.cio.gov/about/accessibility-cop/), distributed at
# https://ictbaseline.access-board.gov/ and https://github.com/atbcb/ICTTestingBaseline.
# Test IDs and names restate published upstream content; the coverage grades, mode
# assignments, and notes are THIS repository's additions, not ACOP content.
#
# Usage rules:
# - Declared-508 audit scope only (the planner federal profile's floor declaration is
#   the gate). Never cite this file or baseline IDs in component-scope reviews. One
#   exemption: engagement-independent capability statements quoting this file verbatim
#   ("designed to cover N of 62; gaps: ...") may answer pre-award/procurement capability
#   questions with no floor declaration — findings, reviews, and reports stay gated.
# - Coverage grades what the stack contributes to each test's Test Instructions check.
#   The baseline's per-test "Identify Content" enumeration step (find the tables, the
#   media, the moving content) is always shared human/agent scoping work and is not
#   graded — except where identification IS the check (those rows say so).
# - coverage values:
#     covered      — an execution mode produces the decisive machine evidence for the
#                    check on sampled views (human review of artifacts still applies)
#     partial      — a mode produces real evidence substrate (targeted extraction or a
#                    machine check on part of the condition) but the decisive
#                    determination is human
#     not-covered  — no mode produces meaningful evidence; the test is assigned to
#                    manual/AT method in the engagement plan. These rows are the
#                    deliverable of this file, not an embarrassment.
#     always-passes — upstream defines the outcome; nothing to execute
# - Invariant: a test classified judgment-only in the manifest is never `covered` here.
# - Phrasing rule: this file supports "designed to cover N of 62; gaps: M" statements.
#   It never supports "baseline-aligned" or "baseline-conformant" — alignment
#   recognition is an external review of a test process, not a self-declared badge.
#
# Mode vocabulary (see SKILL.md routing table):
#   playwright-spec  — codified .spec.js real-key, zoom/reflow, visual-regression tests
#   axe-core         — §4 automated scans (rule ids named where certain; representative,
#                      not exhaustive)
#   kat              — keyboard-a11y-tester batch/driven runs (trace, findings,
#                      reading-order census, dual-signal focus-indicator measurement,
#                      live-region capture)
#   vsr              — @guidepup/virtual-screen-reader component assertions (computed
#                      names/roles, reading order, announcements; synthetic interactions
#                      — never keyboard-operability evidence; blind to open shadow DOM
#                      and aria-busy)
#   agent-browser    — interactive reconnaissance (ARIA snapshots, attribute checks) —
#                      supporting evidence only
#   manual           — human judgment / assistive-technology session

meta:
  built: "2026-08-12"
  manifest: docs/ict-baseline-test-id-manifest.yaml
  reference: docs/ict-testing-baseline-reference.md
  pin: "atbcb/ICTTestingBaseline main @ 6c537a3b (site snapshot 2026-08-12)"
  web_test_count: 62
  coverage_totals: {covered: 22, partial: 26, not-covered: 13, always-passes: 1}
  human_procedure: references/human-verification-walkthrough.md
  human_procedure_note: >-
    Every not-covered row (modes: [manual]) enters the evidence set as a human-sourced
    package in the walk-through's operation or attended-media shape, takes the same four
    dispositions, and cites its baseline id in `closes`. The totals above do not change:
    "covered" grades the machine stack, and these rows are still not covered by it.
  granularity: >-
    Test-level, matching the manifest and the baseline_test finding field. Upstream
    Appendix A maps at instruction level (1.A-1, 1.A-2, ...) and remains the seed if
    finer granularity is ever needed.

