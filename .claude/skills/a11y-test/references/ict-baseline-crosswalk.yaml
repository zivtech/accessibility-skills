documents:
  measurement_scope: >-
    Out of this bundle's measurement scope entirely (web-only stack) — the Electronic
    Documents baseline (57 declared tests) is a declared boundary, not a crosswalk.
    A declared-508 engagement whose scope includes PDFs or Office documents assigns
    those samples to manual/AT methods in the evaluation plan's coverage boundary and
    never implies stack coverage. IDs for validity checking live in the manifest.
