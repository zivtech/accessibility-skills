name: CI

on:
  push:
    branches: [main]
    paths: ['ollama/**', 'evals/**', 'scripts/**', '.claude/**', '.agents/**', 'docs/**', '*.md', '.github/workflows/ci.yml']
  pull_request:
    paths: ['ollama/**', 'evals/**', 'scripts/**', '.claude/**', '.agents/**', 'docs/**', '*.md', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # verify_run_manifests.py walks history to resolve each artifact's
          # historical_git_ref; a depth-1 checkout cannot serve it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ollama/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Content review import and return-loop regressions
        run: node --test scripts/test_ratification_import.mjs scripts/test_content_review_loop.mjs
      - name: Client-reference gate self-test (patterns must fire)
        run: python3 scripts/check_client_refs.py --self-test
      - name: Client-reference scan
        run: python3 scripts/check_client_refs.py
      - name: Compile check
        run: python3 -m py_compile ollama/*.py evals/suites/perspectives/*.py
      - name: Cloud planner condition tests (no model calls)
        run: python3 -m unittest discover -s ollama -p 'test_cloud_planner_conditions.py' -v
      - name: Validate fixtures and registries
        run: python3 scripts/validate_fixtures.py
      - name: Verify retained run manifests
        run: python3 scripts/verify_run_manifests.py
      - name: Test retained run-manifest verifier
        run: python3 scripts/test_verify_run_manifests.py
      - name: Skill lint (frontmatter + fence balance)
        run: python3 scripts/lint_skills.py
      - name: Scorer smoke tests
        run: bash scripts/smoke_scorers.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision pinned OpenACR calibration CLI
        run: npm install --prefix "$RUNNER_TEMP/openacr-calibration" --no-audit --no-fund @openacr/openacr@0.3.8
      - name: ACR scorer calibration (synthetic drafts)
        env:
          OPENACR_CLI_DIR: ${{ runner.temp }}/openacr-calibration
        run: python3 evals/results/acr-reporting-phase2/calibrate.py
      - name: Blind-prompt guard self-test (structural checks must fire)
        run: python3 ollama/test_blind_prompts.py --self-test
      - name: Blind-prompt guard (answer keys, hints, cut lines, headings, titles)
        run: python3 ollama/test_blind_prompts.py
      - name: Mirror parity guard self-test (parity checks must fire)
        run: python3 scripts/check_mirrors.py --self-test
      - name: Mirror drift check (strict)
        run: python3 scripts/check_mirrors.py --strict
